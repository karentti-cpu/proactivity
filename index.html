ver low heat until set, then season.","r.cottagebowl.n":"Cottage cheese and fruit bowl","r.cottagebowl.1":"Spoon cottage cheese into a bowl.","r.cottagebowl.2":"Add chopped fruit and nuts.","r.cottagebowl.3":"Drizzle a little honey if you feel like it.","r.bananapancake.n":"Banana pancakes","r.bananapancake.1":"Mash a banana in a bowl and beat in two eggs.","r.bananapancake.2":"Add ground oats for a thicker batter.","r.bananapancake.3":"Pour small spoonfuls into a hot pan and flip after a minute.","r.lentilsoup.n":"Lentil soup","r.lentilsoup.1":"Fry onion, carrot and garlic in olive oil.","r.lentilsoup.2":"Add rinsed lentils and enough water to cover.","r.lentilsoup.3":"Simmer about 25 minutes until the lentils are soft.","r.lentilsoup.4":"Season and squeeze in lemon before serving.","r.chickenrice.n":"Chicken and rice bowl","r.chickenrice.1":"Cook the rice as directed.","r.chickenrice.2":"Cut the chicken into strips and fry with garlic until no longer pink inside.","r.chickenrice.3":"Add pepper and carrot for the last two minutes.","r.chickenrice.4":"Spoon it over the rice and squeeze lemon on top.","r.tunapasta.n":"Tuna tomato pasta","r.tunapasta.1":"Cook the pasta.","r.tunapasta.2":"Fry garlic in olive oil and add chopped tomatoes.","r.tunapasta.3":"Add drained tuna and warm it through for a minute.","r.tunapasta.4":"Toss with the pasta and squeeze in lemon.","r.pitastuff.n":"Stuffed pita","r.pitastuff.1":"Warm the pita and open it up.","r.pitastuff.2":"Spread hummus inside.","r.pitastuff.3":"Fill with hard-boiled egg or tuna, tomato and cucumber.","r.veggiesoup.n":"Vegetable soup","r.veggiesoup.1":"Chop onion, carrot, potato and courgette.","r.veggiesoup.2":"Soften them in olive oil, then cover with water.","r.veggiesoup.3":"Simmer for 20 minutes until everything is soft, then season.","r.hummusplate.n":"Hummus and vegetable plate","r.hummusplate.1":"Spoon hummus onto a plate.","r.hummusplate.2":"Cut carrot, cucumber and pepper into sticks.","r.hummusplate.3":"Drizzle olive oil over it and dip.","r.applenut.n":"Apple with nut butter","r.applenut.1":"Slice an apple.","r.applenut.2":"Spread nut butter on each slice.","r.applenut.3":"Scatter chopped nuts on top.","r.yogurthoney.n":"Yoghurt, honey and nuts","r.yogurthoney.1":"Put yoghurt in a glass or a bowl.","r.yogurthoney.2":"Drizzle honey and scatter nuts.","r.yogurthoney.3":"You can add berries or banana.","r.cheesecrackers.n":"Crackers, cheese and tomato","r.cheesecrackers.1":"Lay the crackers out on a plate.","r.cheesecrackers.2":"Put a slice of cheese on each one.","r.cheesecrackers.3":"Add sliced tomato and a little olive oil.","qz.t":"Let us see where you are","qz.s":"12 questions, about a minute. There are no right answers — just say what actually happens.","qz.count":"Question {n} of {t}","qz.prev":"Previous question","qz.notest":"It is a snapshot of right now, and it changes the moment you start doing.","dim.init":"Initiative","dim.goal":"Goals","dim.time":"Time management","dim.solve":"Finding solutions","dim.plan":"Planning ahead","dim.choice":"Choice","rs.st.choice":"you know how to pause and choose how to respond","rs.gr.choice":"pausing between what happened and what you do","rs.ac.choice.1":"When something annoys you, take three breaths before answering","rs.ac.choice.2":"In the evening, write down one moment when you chose how to respond","rs.ac.choice.3":"Once a day, swap \"I have to\" for \"I choose to\"","rs.newdim":"The check-in has a new area: choice. Take it again to see it.","rs.t":"Your profile","rs.s":"This is your starting point. From here, you only move forward.","rs.index":"Proactivity score","rs.mean":"What does this mean?","rs.try":"What to try next","rs.cta":"Alright, let us start","rs.again":"Answer again","rs.updated":"Profile updated","rs.ageband":"Your age has changed since you answered. If you like, retake it with questions that fit better.","rs.none":"The check-in is waiting for you. It takes a minute.","rs.b1":"Just starting","rs.b2":"Building momentum","rs.b3":"In control","rs.b4":"Leading yourself","rs.st.init":"when something matters to you, you do not wait to be told — you move","rs.st.goal":"you know where you want to get to, and that is already half the work","rs.st.time":"you know how to start on time instead of sprinting at the end","rs.st.solve":"when something jams, you look for a way through instead of freezing","rs.st.plan":"you think ahead, so fewer things catch you off guard","rs.gr.init":"taking the first step yourself","rs.gr.goal":"writing down what matters to you so it becomes a plan","rs.gr.time":"giving the important things a fixed place before they turn urgent","rs.gr.solve":"trying another way when something gets stuck","rs.gr.plan":"starting the day with a short plan","rs.line":"It looks like {strong}. Your next step: {grow}. That is where you can grow the most right now.","rs.ac.init.1":"Pick one thing this week you do without anyone asking","rs.ac.init.2":"Next time they need a volunteer — give yourself 3 seconds and raise your hand","rs.ac.init.3":"Send a kind message to someone — a friend, a teacher, family","rs.ac.goal.1":"Write one goal in one sentence, with a date","rs.ac.goal.2":"Break it into one step you can do today","rs.ac.goal.3":"At the end of the week look at it again and change what needs changing","rs.ac.time.1":"Pick one task and give it 5 minutes now","rs.ac.time.2":"Give one task a fixed hour in your day","rs.ac.time.3":"Start the day with the most important task — everything is easier after that","rs.ac.solve.1":"Give yourself 10 minutes to try on your own — sometimes that is all it takes","rs.ac.solve.2":"Pick something you want to improve and write one idea for how","rs.ac.solve.3":"Try a new way of doing something familiar — one small change","rs.ac.plan.1":"In the evening, write three things for tomorrow. No more","rs.ac.plan.2":"Get tomorrow ready at night instead of in the morning","rs.ac.plan.3":"Pick one fixed day a week to look at the week ahead","ls.t":"Learn to be proactive","ls.s":"Short reads. Each one takes under a minute and ends with one thing you can do now.","ls.ex":"In real life","ls.do":"Do this now","ls.read":"30 seconds","ls.read2":"1 minute","ls.mk":"Mark as read","ls.done":"Read","ls.1.t":"What is proactive?","ls.1.b":"Being proactive is not being busy all day. It is noticing that you have a choice — and doing something with it, instead of waiting for someone to decide for you.","ls.1.e":"The teacher said there is a test \"soon\". The usual move: wait for a date. The proactive one: ask when, and open the material today.","ls.1.d":"Think of one thing you are waiting on right now. What step could you take without waiting?","ls.2.t":"Proactive vs reactive","ls.2.b":"Reactive = life happens to you and you respond. Proactive = you decide first and then act. Both people do roughly the same things — just in the opposite order.","ls.2.e":"Your phone runs out of space exactly when you need to film. Reactive: deleting in a panic. Proactive: cleared space last week.","ls.2.d":"Find one thing you know will blow up on you in a week. Give it five minutes today.","ls.3.t":"How to stop waiting for motivation","ls.3.b":"Motivation almost never shows up before the action. It shows up after. You do not need to wait until you feel like it — you start small, and the feeling catches up.","ls.3.e":"Nobody feels motivated to run in the rain. But two minutes into the run, stopping is the last thing you want.","ls.3.d":"Pick a task. Do two minutes of it without asking whether you feel like it.","ls.4.t":"How to start with no energy","ls.4.b":"When you have no energy, the problem is almost always the size of the task, not your energy. Shrink it until it looks ridiculous: not \"tidy my room\" but \"pick five things off the floor\".","ls.4.e":"Homework that looks like two hours. Just open the notebook and write the date. You usually will not stop there.","ls.4.d":"Take a big task you have postponed and write its smallest possible version. Then do that.","ls.5.t":"How to deal with procrastination","ls.5.b":"Procrastination is almost always escaping a feeling, not laziness: fear of failing, boredom, or simply not knowing where to start. Once the first step is small and clear, there is nothing to escape from.","ls.5.e":"An assignment you have to hand in. You avoid it for a week — not because it is hard, but because you have no idea where to start.","ls.5.d":"Write down the task you avoid most, then write next to it the very first line you could put in it.","ls.6.t":"How to set a goal that actually happens","ls.6.b":"A good goal answers three questions: what exactly, by when, and what is the first step. \"Get better at basketball\" is not a goal. \"Shoot 50 free throws three times a week until the end of the month\" is.","ls.6.e":"\"I want to get fit\" floats around for a year. \"Run 20 minutes on Tuesday and Thursday\" starts on Tuesday.","ls.6.d":"Take a goal you have in your head and add a number and a date to it.","ls.7.t":"How a goal turns into a habit","ls.7.b":"A habit forms when the action gets a fixed slot — same time, same place, right after the same thing. You stop having to decide every day, and that is exactly what saves the energy.","ls.7.e":"\"I will read when I have time\" does not happen. \"I read ten minutes right after brushing my teeth\" almost runs itself.","ls.7.d":"Pick one action and attach it to something you already do every day.","ls.8.t":"When something does not work out","ls.8.b":"Failing is information, not a verdict. The only question worth asking is \"what exactly did not work?\" — because that has an answer, and \"why am I like this\" does not.","ls.8.e":"You failed a test. \"I am bad at maths\" helps nobody. \"I studied only the night before and only the last page\" — that is something you can change.","ls.8.d":"Think of something that recently did not work, and write one sentence: what you will do differently next time.","ls.9.t":"The moment between what happens and what I do","ls.9.b":"Between what happens to you and what you do, there is a small moment. Reactive skips it and answers on autopilot. Proactive uses it to choose. You cannot always change what happened. Your response, you can.","ls.9.e":"Someone posts something insulting about you in the group chat. Autopilot: fire back angry, right away. Choice: stop, breathe, and decide whether to answer, when and how.","ls.9.d":"Next time something annoys you, stop for three breaths and ask: \"What do I choose to do now?\"","ac.t":"Achievements","ac.s":"They unlock as you go, and each one is a small celebration.","ac.got":"{n} of {t} unlocked","ac.locked":"On the way","ac.new":"New achievement: {x}","ac.1.t":"First step","ac.1.d":"You closed one task","ac.2.t":"Three days running","ac.2.d":"You came back three days in a row","ac.3.t":"First goal","ac.3.d":"You set a goal of your own","ac.4.t":"You took initiative","ac.4.d":"You closed a daily challenge","ac.5.t":"You planned ahead","ac.5.d":"You hit a weekly target on the grid","ac.6.t":"You came back!","ac.6.d":"You came back and kept going after a break in the streak","ac.7.t":"Curious","ac.7.d":"You read three lessons","ac.8.t":"You know yourself","ac.8.d":"You completed the check-in","ac.9.t":"A full week","ac.9.d":"Seven days in a row","ac.10.t":"Ten tasks","ac.10.d":"You closed ten tasks","n.hero.q1":"The difference between success and failure is the distance between ","n.hero.q2":"somebody should do this","n.hero.q3":" and ","n.hero.q4":"I am doing this","n.hero.q5":".","n.hero.lead":"Your time to start.","n.hero.sub2":"From now on, you are who you decide to be.","n.hero.who":"For teens and every age. One small step a day.","n.hero.s1":"A minute of questions: see where you stand","n.hero.s2":"Pick one goal","n.hero.s3":"Every day: one small step","n.hero.go":"Start — one minute","n.hero.cta":"Let's start","n.hero.note":"No sign-up · No email · Everything stays on your device","n.def.t":"So what is it, actually?","n.def.b":"Being proactive means noticing what you can do — and doing it, on your own initiative.","n.def.re":"Reactive","n.def.pro":"Proactive","n.sc.1.t":"A deadline in a week","n.sc.1.r":"\"There is loads of time.\"","n.sc.1.p":"\"20 minutes today, and I am not panicking at the end.\"","n.sc.2.t":"Training","n.sc.2.r":"\"I will go when I feel like it.\"","n.sc.2.p":"\"Tuesday and Thursday at six. Already decided.\"","n.sc.7.t":"Talking to someone","n.sc.7.r":"\"Maybe they will message me first.\"","n.sc.7.p":"\"I am writing the message now and sending it.\"","n.sc.8.t":"A personal goal","n.sc.8.r":"\"One day it will happen.\"","n.sc.8.p":"\"Wrote it down, set a date, started.\"","n.def.close":"Moving one area is enough — it spreads from there.","n.fin.t":"So what is your first step?","n.fin.sub":"One minute, and you know where you stand.","n.o.1.t":"Welcome. This is where it starts.","n.o.1.s":"Thirty seconds of explanation, then we start.","n.o.1.p1":"We check how you handle things today — 12 short questions.","n.o.1.p2":"You get a personal snapshot, clear and encouraging.","n.o.1.p3":"Then we start with one small step. Actually one.","n.o.1.go":"Let us go","n.o.2.t":"A bit about you","n.o.2.s":"Only what actually helps tailor things. No sign-up, no email.","n.o.2.name":"What should we call you?","n.o.2.nameph":"Name or nickname (optional)","n.o.2.age":"How old are you?","n.o.2.color":"Which colour suits you?","n.o.2.colorn":"You can switch it any time up top.","n.o.2.privacy":"We do not ask for email, phone or address. Everything stays in your browser only.","n.o.3.t":"What do you want to move forward?","n.o.3.s":"Pick as many as you like. You can change this later.","n.o.3.time":"How much time do you realistically have a day?","n.o.5.t":"Your first target","n.o.5.s":"Pick an area, answer three questions, and get a target that follows from what you said.","n.o.5.ph":"e.g. get better at basketball","n.o.5.skip":"Carry on — we can come back to it","n.o.6 e goal","wk3.idea":"\"{x}\" keeps coming back. Maybe it is a goal?","wk.this":"This week","wk.prev":"Previous week","wk.next":"Next week","wk.active":"active days","wk.feel":"How I felt","wk.tap":"Tap a day to see what it held.","wk.d.today":"Today is still open. Every small step lands here.","wk.d.rest":"A day of rest. That is part of the way too.","wk3.mk":"Make it a goal","mg.t":"My goal","mg.s":"Pick an area, or write a goal in your own words.","mg.ph":"e.g. read a book a month","mg.tn":"My goals","mg.add":"Another goal","mg.s2":"What else matters to you? Pick an area, or write it in your own words.","mg.all":"All goals","ge.btn":"Edit","ge.now.ph":"The smallest step you can take right now","mg.today":"Today's step","mg.done":"Today's step is done. Well done!","mg.nostep":"Tap \"Edit\" and write today's small step.","d.start5":"I am starting 5 minutes now","d.mark":"Did it","d.running":"Running · {t}","d.timeup":"Five minutes are up. You did it.","d.sk.0":"Today starts a new streak.","d.sk.1":"One day in. Nice.","d.sk.n":"{n} days in a row. That is momentum.","d.sk.miss":"Today is a new day. Carry on from here.","n.tk.t":"My tasks","n.tk.s":"All optional. Tick what you actually did.","gl.goal":"Goal","gl.week":"This week","gl.today":"Today","gl.now":"Right now","gl.now.btn":"Start now","gl.wk.ph":"What will you do this week?","gl.td.ph":"And today?","gl.steps":"Suggested steps","gl.saved":"Saved","n.pg.t":"My progress","n.pg.s":"Here you can see it moving forward.","n.pg.week":"Weekly tracking board","n.empty.goals":"Your first goal will appear here. Write one and we will break it down together.","seo.title":"Proacty — stop putting things off and start doing","seo.desc":"What does proactive mean and how do you become it? A short check-in shows where things stand on initiative, goals, time and planning — then a target built from what you said, small steps, and habits that stick. No sign-up.","pf.t":"My details","pf.s":"What you put here decides which questions and which plans you get, and how the app speaks to you.","n.o.2.gender":"How should we address you?","n.o.2.gendern":"This only sets how the site talks to you. Change it whenever you like.","qz.a13.1.q":"You have a test in a week. What usually happens?","qz.a13.1.a":"I start studying a few days ahead","qz.a13.1.b":"I tell myself there is plenty of time","qz.a13.1.c":"I remember the night before","qz.a13.1.d":"Depends how much the subject matters to me","qz.a13.2.q":"They need a volunteer for a class project. What do you do?","qz.a13.2.a":"I raise my hand","qz.a13.2.b":"I wait to see who else volunteers","qz.a13.2.c":"I hope they do not pick me","qz.a13.2.d":"Depends if the topic interests me","qz.a13.3.q":"There is something you want to achieve. What does it look like right now?","qz.a13.3.a":"Written down, with a deadline","qz.a13.3.b":"I roughly know what and when","qz.a13.3.c":"It only lives in my head","qz.a13.3.d":"I do not have anything clear right now","qz.a13.4.q":"Your bag and your room — what is the situation?","qz.a13.4.a":"Tidy, I know where everything is","qz.a13.4.b":"Decent, sometimes it drifts","qz.a13.4.c":"A mess, but I find my way in it","qz.a13.4.d":"I hunt for stuff every morning","qz.a13.5.q":"Something is not working out. What is your first move?","qz.a13.5.a":"I try to solve it myself, and if not — I ask","qz.a13.5.b":"I ask someone straight away","qz.a13.5.c":"I leave it for \"later\"","qz.a13.5.d":"I get stuck and frustrated","qz.a13.6.q":"Things that need doing at home — how do they get done?","qz.a13.6.a":"I just do them myself","qz.a13.6.b":"One reminder and it is done","qz.a13.6.c":"It takes a few reminders","qz.a13.6.d":"Usually someone else ends up doing it","qz.a13.7.q":"Last time you started doing something every day — how long did it last?","qz.a13.7.a":"A month or more, it is still with me","qz.a13.7.b":"A few weeks","qz.a13.7.c":"A few days","qz.a13.7.d":"A day or two and it vanished","qz.a13.8.q":"How much of your day is planned before it starts?","qz.a13.8.a":"Most of it, I have a clear picture","qz.a13.8.b":"Broadly, without the details","qz.a13.8.c":"I find out as I go","qz.a13.8.d":"Almost none of it","qz.a13.9.q":"You failed at something you put work into. Where are you two days later?","qz.a13.9.a":"Already trying again, differently","qz.a13.9.b":"Trying again exactly the same way","qz.a13.9.c":"Taking a long break from it","qz.a13.9.d":"I usually do not go back to it","qz.a13.10.q":"A task you really do not want to do. When do you start it?","qz.a13.10.a":"First, to get it over with","qz.a13.10.b":"I set myself a time and start then","qz.a13.10.c":"I push it until there is no choice","qz.a13.10.d":"Sometimes it just never happens","qz.a18.1.q":"You have an exam or a deadline in a week. What usually happens?","qz.a18.1.a":"I split it over several days in advance","qz.a18.1.b":"I tell myself there is still time","qz.a18.1.c":"I do the whole thing the last night","qz.a18.1.d":"Depends how much it affects the grade or the job","qz.a18.2.q":"At your course or your job, someone has to take this on. What do you do?","qz.a18.2.a":"I say I will take it","qz.a18.2.b":"I wait to see if someone else offers","qz.a18.2.c":"I stay quiet and hope nobody turns to me","qz.a18.2.d":"Depends how close it is to what interests me","qz.a18.3.q":"There is something you want to achieve this year. What does it look like now?","qz.a18.3.a":"Written down, with a date and a first step","qz.a18.3.b":"I roughly know what and when","qz.a18.3.c":"It only lives in my head","qz.a18.3.d":"I do not have anything clear right now","qz.a18.4.q":"Your room, your desk and your files — what is the situation?","qz.a18.4.a":"Organised, I find anything in seconds","qz.a18.4.b":"Decent, sometimes it drifts","qz.a18.4.c":"A mess, but I find my way in it","qz.a18.4.d":"I waste time looking for things","qz.a18.5.q":"Something is stuck — in your studies, your job or some paperwork. First move?","qz.a18.5.a":"I look into it myself, and .roastveg.2":"Mélange avec huile d'olive, sel et ail.","r.roastveg.3":"Enfourne jusqu'à ce que les bords dorent.","r.avocadotoast.n":"Toast à l'avocat","r.avocadotoast.1":"Grille deux tranches de pain.","r.avocadotoast.2":"Écrase l'avocat avec un peu de citron et de sel.","r.avocadotoast.3":"Étale sur le pain et ajoute de la tomate.","r.scrambleveg.n":"Œufs brouillés aux légumes","r.scrambleveg.1":"Coupe poivron et oignon et fais-les revenir à l'huile.","r.scrambleveg.2":"Bats les œufs et verse-les.","r.scrambleveg.3":"Remue à feu doux jusqu'à prise, puis assaisonne.","r.cottagebowl.n":"Bol de cottage aux fruits","r.cottagebowl.1":"Mets du cottage dans un bol.","r.cottagebowl.2":"Ajoute des fruits coupés et des noix.","r.cottagebowl.3":"Ajoute un filet de miel si tu veux.","r.bananapancake.n":"Pancakes à la banane","r.bananapancake.1":"Écrase une banane et incorpore deux œufs.","r.bananapancake.2":"Ajoute des flocons d'avoine moulus pour épaissir.","r.bananapancake.3":"Verse de petites louches dans une poêle chaude et retourne après une minute.","r.lentilsoup.n":"Soupe de lentilles","r.lentilsoup.1":"Fais revenir oignon, carotte et ail à l'huile.","r.lentilsoup.2":"Ajoute les lentilles rincées et de l'eau à hauteur.","r.lentilsoup.3":"Laisse mijoter environ 25 minutes.","r.lentilsoup.4":"Assaisonne et presse du citron avant de servir.","r.chickenrice.n":"Bol poulet-riz","r.chickenrice.1":"Cuis le riz.","r.chickenrice.2":"Coupe le poulet en lanières et fais-le cuire avec l'ail jusqu'à ce qu'il ne soit plus rosé.","r.chickenrice.3":"Ajoute poivron et carotte les deux dernières minutes.","r.chickenrice.4":"Dispose sur le riz et presse du citron.","r.tunapasta.n":"Pâtes au thon et tomates","r.tunapasta.1":"Cuis les pâtes.","r.tunapasta.2":"Fais revenir l'ail et ajoute les tomates coupées.","r.tunapasta.3":"Ajoute le thon égoutté et réchauffe une minute.","r.tunapasta.4":"Mélange aux pâtes et presse du citron.","r.pitastuff.n":"Pita garnie","r.pitastuff.1":"Réchauffe la pita et ouvre-la.","r.pitastuff.2":"Étale du houmous à l'intérieur.","r.pitastuff.3":"Garnis d'œuf dur ou de thon, tomate et concombre.","r.veggiesoup.n":"Soupe de légumes","r.veggiesoup.1":"Coupe oignon, carotte, pomme de terre et courgette.","r.veggiesoup.2":"Fais-les revenir puis couvre d'eau.","r.veggiesoup.3":"Laisse mijoter 20 minutes puis assaisonne.","r.hummusplate.n":"Assiette houmous-crudités","r.hummusplate.1":"Dépose du houmous dans une assiette.","r.hummusplate.2":"Coupe carotte, concombre et poivron en bâtonnets.","r.hummusplate.3":"Arrose d'huile d'olive et trempe.","r.applenut.n":"Pomme au beurre de noix","r.applenut.1":"Coupe une pomme en tranches.","r.applenut.2":"Étale du beurre de noix sur chaque tranche.","r.applenut.3":"Parsème de noix concassées.","r.yogurthoney.n":"Yaourt, miel et noix","r.yogurthoney.1":"Mets du yaourt dans un verre ou un bol.","r.yogurthoney.2":"Ajoute du miel et des noix.","r.yogurthoney.3":"Tu peux ajouter des fruits rouges ou de la banane.","r.cheesecrackers.n":"Crackers, fromage et tomate","r.cheesecrackers.1":"Dispose les crackers sur une assiette.","r.cheesecrackers.2":"Pose une tranche de fromage sur chacun.","r.cheesecrackers.3":"Ajoute de la tomate et un filet d'huile d'olive.","qz.t":"Voyons où tu en es","qz.s":"12 questions, environ une minute. Pas de bonnes réponses — dis juste ce qui se passe vraiment.","qz.count":"Question {n} sur {t}","qz.prev":"Question précédente","qz.notest":"C'est un instantané de maintenant, qui change dès que tu passes à l'action.","dim.init":"Initiative","dim.goal":"Objectifs","dim.time":"Gestion du temps","dim.solve":"Trouver des solutions","dim.plan":"Anticipation","dim.choice":"Choix","rs.st.choice":"tu sais t'arrêter un instant et choisir comment réagir","rs.gr.choice":"faire une pause entre ce qui arrive et ce que tu fais","rs.ac.choice.1":"Quand quelque chose t'agace, prends trois respirations avant de répondre","rs.ac.choice.2":"Le soir, note un moment où tu as choisi comment réagir","rs.ac.choice.3":"Une fois par jour, remplace « je dois » par « je choisis »","rs.newdim":"Le questionnaire a un nouveau domaine : le choix. Refais-le pour le voir.","rs.t":"Ton profil","rs.s":"C'est ton point de départ. D'ici, on avance.","rs.index":"Indice de proactivité","rs.mean":"Ça veut dire quoi ?","rs.try":"À essayer maintenant","rs.cta":"Allez, on commence","rs.again":"Refaire le test","rs.updated":"Profil mis à jour","rs.ageband":"Ton âge a changé depuis tes réponses. Si tu veux, refais-le avec des questions plus adaptées.","rs.none":"Le bilan t'attend. Ça prend une minute.","rs.b1":"Au début","rs.b2":"En train de lancer","rs.b3":"Aux commandes","rs.b4":"Tu te diriges","rs.st.init":"quand un truc compte pour toi, tu n'attends pas qu'on te le dise — tu bouges","rs.st.goal":"tu sais où tu veux aller, et c'est déjà la moitié du travail","rs.st.time":"tu sais démarrer à temps au lieu de courir à la fin","rs.st.solve":"quand ça coince, tu cherches une solution au lieu de rester bloqué","rs.st.plan":"tu anticipes, donc moins de choses te prennent au dépourvu","rs.gr.init":"faire le premier pas toi-même","rs.gr.goal":"écrire ce qui compte pour toi pour en faire un plan","rs.gr.time":"donner une place fixe à l'important avant qu'il devienne urgent","rs.gr.solve":"essayer une autre voie quand ça bloque","rs.gr.plan":"commencer la journée avec un petit plan","rs.line":"On dirait que {strong}. Ton prochain pas : {grow}. C'est là que tu peux le plus progresser maintenant.","rs.ac.init.1":"Choisis une chose cette semaine que tu fais sans qu'on te le demande","rs.ac.init.2":"La prochaine fois qu'on cherche un volontaire — compte 3 secondes et lève la main","rs.ac.init.3":"Envoie un message sympa à quelqu'un — un ami, un prof, ta famille","rs.ac.goal.1":"Écris un objectif en une phrase, avec une date","rs.ac.goal.2":"Découpe-le en une étape faisable aujourd'hui","rs.ac.goal.3":"En fin de semaine, relis-le et ajuste ce qu'il faut","rs.ac.time.1":"Choisis une tâche et donne-lui 5 minutes maintenant","rs.ac.time.2":"Donne à une tâche une heure fixe dans ta journée","rs.ac.time.3":"Commence la journée par la tâche la plus importante — tout devient plus simple ensuite","rs.ac.solve.1":"Donne-toi 10 minutes pour essayer seul{|e} — parfois, ça suffit","rs.ac.solve.2":"Choisis une chose à améliorer et écris une idée pour y arriver","rs.ac.solve.3":"Essaie une nouvelle façon de faire un truc habituel — un petit changement","rs.ac.plan.1":"Le soir, écris trois choses pour demain. Pas plus","rs.ac.plan.2":"Prépare le lendemain le soir plutôt que le matin","rs.ac.plan.3":"Choisis un jour fixe par semaine pour regarder la semaine à venir","ls.t":"Apprendre à être proactif","ls.s":"Des lectures courtes. Moins d'une minute chacune, et ça finit par un truc à faire maintenant.","ls.ex":"Dans la vraie vie","ls.do":"Fais ça maintenant","ls.read":"30 secondes","ls.read2":"1 minute","ls.mk":"Marquer comme lu","ls.done":"Lu","ls.1.t":"C'est quoi, proactif ?","ls.1.b":"Être proacti{f|ve}, ce n'est pas être occupé{|e} toute la journée. C'est remarquer que tu as le choix — et en faire quelque chose, au lieu d'attendre qu'on décide pour toi.","ls.1.e":"La prof a dit qu'il y aurait un contrôle « bientôt ». Réflexe habituel : attendre la date. Réflexe proactif : demander quand, et ouvrir le cours aujourd'hui.","ls.1.d":"Pense à une chose que tu attends en ce moment. Quel pas peux-tu faire sans attendre ?","ls.2.t":"Proactif ou réactif","ls.2.b":"Réactif = la vie t'arrive dessus et tu réagis. Proactif = tu décides d'abord, puis tu agis. Les deux font à peu près les mêmes choses — dans l'ordre inverse.","ls.2.e":"Ton téléphone est plein pile quand tu dois filmer. Réactif : tu supprimes en panique. Proactif : tu avais fait de la place la semaine d'avant.","ls.2.d":"Trouve un truc qui va te retomber dessus dans une semaine. Donne-lui cinq minutes aujourd'hui.","ls.3.t":"Arrêter d'attendre la motivation","ls.3.b":"La motivation n'arrive presque jamais avant l'action. Elle arrive après. Tu n'as pas besoin d'attendre l'envie — commence petit, et l'envie suit.","ls.3.e":"Personne n'a envie de courir sous la pluie. Mais deux minutes après le départ, tu n'as plus envie de t'arrêter.","ls.3.d":"Choisis une tâche. Fais-en deux minutes sans te demander si tu en as envie.","ls.4.t":"Démarrer sans énergie","ls.4.b":"Quand tu n'as plus d'énergie, le problème est presque toujours la taille de la tâche, pas ton énergie. Réduis-la jusqu'à ce qu'elle paraisse ridicule : pas « ranger ma chambre » mais « ramasser cinq trucs par terre ».","ls.4.e":"Des devoirs qui ressemblent à deux heures. Ouvre juste le cahier et écris la date. En général tu ne t'arrêtes pas là.","ls.4.d":"Prends une grosse tâche repoussée et écris sa plus petite version. Puis fais-la.","ls.5.t":"Gérer la procrastination","ls.5.b":"La procrastination, c'est presque toujours fuir une émotion, pas de la paresse : peur d'échouer, ennui, ou juste ne pas savoir par où commencer. Dès que la première étape est petite et claire, il n'y a plus rien à fuir.","ls.5.e":"Un devoir à rendre. Tu l'évites une semaine — pas parce que c'est dur, mais parce que tu ne sais pas par où commencer.","ls.5.d":"Écris la tâche que tu évites le plus, puis à côté la toute première ligne que tu pourrais y écrire.","ls.6.t":"Fixer un objectif qui se réalise","ls.6.b":"Un bon objectif répond à trois questions : quoi exactement, pour quand, et quelle est la première étape. « Progresser au basket » n'est pas un objectif. « Tirer 50 lancers francs trois fois par semaine jusqu'à la fin du mois », si.","ls.6.e":"« Je veux me remettre en forme » traîne un an. « Courir 20 minutes mardi et jeudi » commence mardi.","ls.6.d":"Prends un objectif que tu as en tête et ajoute-lui un chiffre et une date.","ls.7.t":"Transformer un objectif en habitude","ls.7.b":"Une habitude se crée quand l'action a une place fixe — même heure, même endroit, juste après la même chose. Tu n'as plus à décider chaque jour, et c'est ça qui économise l'énergie.","ls.7.e":"« Je lirai quand j'aurai le temps » n'arrive jamais. « Je lis dix minutes après m'être brossé les dents » se fait presque tout seul.","ls.7.d":"Choisis une action et accroche-la à un truc que tu fais déjà chaque jour.","ls.8.t":"Quand ça ne marche pas","ls.8.b":"Échouer, c'est une info, pas un verdict. La seule question qui vaut : « qu'est-ce qui n'a pas marché, exactement ? » — parce qu'elle a une réponse, contrairement à « pourquoi je suis comme ça ».","ls.8.e":"Tu as raté un contrôle. « Je suis nul en maths » n'aide pas. « J'ai révisé la veille et seulement la dernière page » — ça, tu peux le changer.","ls.8.d":"Pense à un truc récemment raté et écris une phrase : ce que tu feras autrement.","ls.9.t":"Le moment entre ce qui arrive et ce que je fais","ls.9.b":"Entre ce qui t'arrive et ce que tu fais, il y a un petit moment. Le réactif le saute et répond en pilote automatique. Le proactif s'en sert pour choisir. On ne peut pas toujours changer ce qui est arrivé. Sa réponse, si.","ls.9.e":"Quelqu'un écrit un truc vexant sur toi dans le groupe. Pilote automatique : répondre tout de suite, énervé. Choix : s'arrêter, respirer, et décider si on répond, quand et comment.","ls.9.d":"La prochaine fois que quelque chose t'agace, arrête-toi trois respirations et demande-toi : « Qu'est-ce que je choisis de faire maintenant ? »","ac.t":"Réussites","ac.s":"Ils se débloquent en avançant, et chacun est une petite fête.","ac.got":"{n} sur {t} débloquées","ac.locked":"En route","ac.new":"Nouvelle réussite : {x}","ac.1.t":"Premier pas","ac.1.d":"Tu as bouclé une tâche","ac.2.t":"Trois jours d'affilée","ac.2.d":"Tu es revenu trois jours de suite","ac.3.t":"Premier objectif","ac.3.d":"Tu as fixé ton propre objectif","ac.4.t":"Tu as pris l'initiative","ac.4.d":"Tu as relevé un défi du jour","ac.5.t":"Tu as anticipé","ac.5.d":"Tu as atteint un objectif hebdo","ac.6.t":"Tu es revenu !","ac.6.d":"Tu es revenu et as continué après une pause","ac.7.t":"Curieux","ac.7.d":"Tu as lu trois leçons","ac.8.t":"Tu te connais","ac.8.d":"Tu as fait le point","ac.9.t":"Une semaine entière","ac.9.d":"Sept jours de suite","ac.10.t":"Dix tâches","ac.10.d":"Tu as bouclé dix tâches","n.hero.q1":"La différence entre réussir et échouer, c'est la distance entre ","n.hero.q2":"quelqu'un devrait le faire","n.hero.q3":" et ","n.hero.q4":"je le fais","n.hero.q5":".","n.hero.lead":"C'est ton moment de commencer.","n.hero.sub2":"À partir de maintenant, tu es qui tu décides d'être.","n.hero.who":"Pour les ados et tous les âges. Un petit pas par jour.","n.hero.s1":"Une minute de questions : voir où tu en es","n.hero.s2":"Choisir un objectif","n.hero.s3":"Chaque jour : un petit pas","n.hero.go":"Commencer — une minute","n.hero.cta":"On commence","n.hero.note":"Sans inscription · Sans e-mail · Tout reste sur ton appareil","n.def.t":"Alors, c'est quoi ?","n.def.b":"Être proactif, c'est voir ce que tu peux faire — et le faire, de ta propre initiative.","n.def.re":"Réactif","n.def.pro":"Proactif","n.sc.1.t":"Une échéance dans une semaine","n.sc.1.r":"« J'ai plein de temps. »","n.sc.1.p":"« 20 minutes aujourd'hui, et pas de panique à la fin. »","n.sc.2.t":"Entraînement","n.sc.2.r":"« J'irai quand j'aurai envie. »","n.sc.2.p":"« Mardi et jeudi à six heures. C'est décidé. »","n.sc.7.t":"Parler à quelqu'un","n.sc.7.r":"« Peut-être qu'il m'écrira en premier. »","n.sc.7.p":"« J'écris le message maintenant et je l'envoie. »","n.sc.8.t":"Un objectif perso","n.sc.8.r":"« Un jour ça arrivera. »","n.sc.8.p":"« Je l'ai écrit, daté, commencé. »","n.def.close":"Faire bouger un domaine suffit — ça se propage ensuite.","n.fin.t":"Alors, c'est quoi ton premier pas ?","n.fin.sub":"Une minute, et tu sais où tu en es.","n.o.1.t":"Bienvenue. C'est ici que ça commence.","n.o.1.s":"Trente secondes d'explication, puis on démarre.","n.o.1.p1":"On regarde comment tu gères aujourd'hui — 12 questions courtes.","n.o.1.p2":"Tu obtiens un instantané perso, clair et encouragean he un volontaire pour un projet en classe. Tu fais quoi ?","qz.a13.2.a":"Je lève la main","qz.a13.2.b":"J'attends de voir qui se propose","qz.a13.2.c":"J'espère qu'on ne me choisira pas","qz.a13.2.d":"Ça dépend si le sujet m'intéresse","qz.a13.3.q":"Il y a un truc que tu veux réussir. Ça ressemble à quoi, là ?","qz.a13.3.a":"Écrit quelque part, avec une date","qz.a13.3.b":"Je sais à peu près quoi et quand","qz.a13.3.c":"C'est seulement dans ma tête","qz.a13.3.d":"Je n'ai rien de clair en ce moment","qz.a13.4.q":"Ton sac et ta chambre — c'est comment ?","qz.a13.4.a":"Rangé, je sais où est chaque chose","qz.a13.4.b":"Correct, parfois ça part en vrille","qz.a13.4.c":"Le bazar, mais je m'y retrouve","qz.a13.4.d":"Je cherche mes affaires chaque matin","qz.a13.5.q":"Quelque chose ne marche pas. C'est quoi ton premier réflexe ?","qz.a13.5.a":"J'essaie seul{|e}, et sinon je demande","qz.a13.5.b":"Je demande tout de suite","qz.a13.5.c":"Je laisse ça pour \"plus tard\"","qz.a13.5.d":"Je bloque et ça m'énerve","qz.a13.6.q":"Les trucs à faire à la maison — ça se passe comment ?","qz.a13.6.a":"Je les fais de moi-même","qz.a13.6.b":"Un rappel et c'est réglé","qz.a13.6.c":"Il faut me le rappeler plusieurs fois","qz.a13.6.d":"En général quelqu'un d'autre le fait","qz.a13.7.q":"La dernière fois que tu as commencé un truc quotidien — ça a duré combien ?","qz.a13.7.a":"Un mois ou plus, je le fais encore","qz.a13.7.b":"Quelques semaines","qz.a13.7.c":"Quelques jours","qz.a13.7.d":"Un ou deux jours et c'est parti","qz.a13.8.q":"Quelle part de ta journée est prévue avant qu'elle commence ?","qz.a13.8.a":"La plupart, j'ai une idée claire","qz.a13.8.b":"En gros, sans les détails","qz.a13.8.c":"Je découvre au fur et à mesure","qz.a13.8.d":"Presque rien","qz.a13.9.q":"Tu as raté un truc dans lequel tu t'étais investi{|e}. Tu en es où deux jours après ?","qz.a13.9.a":"Je réessaie déjà, autrement","qz.a13.9.b":"Je réessaie exactement pareil","qz.a13.9.c":"Je fais une longue pause","qz.a13.9.d":"En général je n'y reviens pas","qz.a13.10.q":"Une tâche dont tu n'as aucune envie. Tu la commences quand ?","qz.a13.10.a":"En premier, pour en finir","qz.a13.10.b":"Je me fixe une heure et je m'y mets","qz.a13.10.c":"Je repousse jusqu'au dernier moment","qz.a13.10.d":"Parfois elle ne se fait jamais","qz.a18.1.q":"Tu as un examen ou une échéance dans une semaine. Il se passe quoi ?","qz.a18.1.a":"Je l'étale sur plusieurs jours à l'avance","qz.a18.1.b":"Je me dis qu'il reste du temps","qz.a18.1.c":"Je fais tout la dernière nuit","qz.a18.1.d":"Ça dépend de l'impact sur la note ou le travail","qz.a18.2.q":"Dans ton cours ou ton boulot, il faut que quelqu'un s'en charge. Tu fais quoi ?","qz.a18.2.a":"Je dis que je m'en charge","qz.a18.2.b":"J'attends de voir si quelqu'un se propose","qz.a18.2.c":"Je reste discret{|ète} en espérant qu'on ne me demande pas","qz.a18.2.d":"Ça dépend si c'est proche de ce qui m'intéresse","qz.a18.3.q":"Il y a quelque chose que tu veux réussir cette année. Ça ressemble à quoi ?","qz.a18.3.a":"Écrit, avec une date et une première étape","qz.a18.3.b":"Je sais à peu près quoi et quand","qz.a18.3.c":"C'est seulement dans ma tête","qz.a18.3.d":"Je n'ai rien de clair en ce moment","qz.a18.4.q":"Ta chambre, ton bureau et tes fichiers — c'est comment ?","qz.a18.4.a":"Rangé, je trouve tout en quelques secondes","qz.a18.4.b":"Correct, parfois ça part en vrille","qz.a18.4.c":"Le bazar, mais je m'y retrouve","qz.a18.4.d":"Je perds du temps à chercher mes affaires","qz.a18.5.q":"Quelque chose bloque — études, boulot ou paperasse. Premier réflexe ?","qz.a18.5.a":"Je cherche seul{|e}, et si besoin je vais voir qui sait","qz.a18.5.b":"Je demande tout de suite","qz.a18.5.c":"Je repousse à la semaine prochaine","qz.a18.5.d":"Je bloque et ça m'énerve","qz.a18.6.q":"L'intendance de ta vie — linge, factures, rendez-vous. Ça se fait comment ?","qz.a18.6.a":"Je m'en occupe avant que ça devienne urgent","qz.a18.6.b":"Je les fais dès que j'y pense","qz.a18.6.c":"Je оянный день в неделю, чтобы посмотреть на следующую","ls.t":"Учимся быть проактивным","ls.s":"Короткие тексты. Каждый меньше минуты и заканчивается одним делом на сейчас.","ls.ex":"В реальной жизни","ls.do":"Сделай это сейчас","ls.read":"30 секунд","ls.read2":"1 минута","ls.mk":"Отметить прочитанным","ls.done":"Прочитано","ls.1.t":"Что такое проактивность?","ls.1.b":"Быть проактивным — не значит быть занятым весь день. Это заметить, что у тебя есть выбор, и что-то с ним сделать, вместо того чтобы ждать, пока решат за тебя.","ls.1.e":"Учитель сказал, что скоро контрольная. Обычная реакция — ждать даты. Проактивная — спросить когда и открыть материал сегодня.","ls.1.d":"Подумай об одном деле, которого ты сейчас ждёшь. Какой шаг ты можешь сделать, не дожидаясь?","ls.2.t":"Проактивный или реактивный","ls.2.b":"Реактивный — жизнь случается с тобой, и ты реагируешь. Проактивный — ты сначала решаешь, потом действуешь. Оба делают примерно одно и то же, только в обратном порядке.","ls.2.e":"Память в телефоне кончилась ровно тогда, когда надо снимать. Реактивно — удалять в панике. Проактивно — освободил место на прошлой неделе.","ls.2.d":"Найди одно дело, которое рванёт через неделю. Дай ему пять минут сегодня.","ls.3.t":"Как перестать ждать мотивацию","ls.3.b":"Мотивация почти никогда не приходит до действия. Она приходит после. Не нужно ждать желания — начни с малого, и желание догонит.","ls.3.e":"Никто не хочет бежать под дождём. Но через две минуты бега остановиться уже не хочется.","ls.3.d":"Выбери задачу. Сделай две минуты, не спрашивая, хочется ли.","ls.4.t":"Как начать без сил","ls.4.b":"Когда нет сил, проблема почти всегда в размере задачи, а не в твоих силах. Уменьши её до смешного: не «убрать комнату», а «поднять пять вещей с пола».","ls.4.e":"Домашка, которая выглядит на два часа. Просто открой тетрадь и напиши дату. Обычно на этом ты не остановишься.","ls.4.d":"Возьми большую отложенную задачу и запиши её минимальную версию. И сделай именно её.","ls.5.t":"Что делать с прокрастинацией","ls.5.b":"Прокрастинация — почти всегда бегство от чувства, а не лень: страх провала, скука или просто непонятно, с чего начать. Как только первый шаг мал и ясен, бежать не от чего.","ls.5.e":"Работа, которую надо сдать. Ты избегаешь её неделю — не потому что сложно, а потому что непонятно, с чего начать.","ls.5.d":"Запиши задачу, которую избегаешь больше всего, а рядом — самую первую строчку, которую в ней можно написать.","ls.6.t":"Как поставить цель, которая случится","ls.6.b":"Хорошая цель отвечает на три вопроса: что именно, к какому сроку и какой первый шаг. «Стать лучше в баскетболе» — не цель. «Бросать 50 штрафных три раза в неделю до конца месяца» — цель.","ls.6.e":"«Хочу быть в форме» висит в воздухе год. «Бегать 20 минут во вторник и четверг» начинается во вторник.","ls.6.d":"Возьми цель, что у тебя в голове, и добавь к ней число и дату.","ls.7.t":"Как цель становится привычкой","ls.7.b":"Привычка складывается, когда у действия есть постоянное место — то же время, то же место, сразу после того же события. Не нужно решать заново каждый день — именно это и экономит силы.","ls.7.e":"«Почитаю, когда будет время» не случается. «Читаю десять минут сразу после чистки зубов» работает почти само.","ls.7.d":"Выбери одно действие и привяжи его к тому, что ты и так делаешь каждый день.","ls.8.t":"Когда что-то не получается","ls.8.b":"Провал — это информация, а не приговор. Единственный стоящий вопрос: «что именно не сработало?» — на него есть ответ, а на «почему я такой» — нет.","ls.8.e":"Ты завалил контрольную. «Я плох в математике» не помогает. «Я готовился только накануне и только по последней странице» — вот это можно изменить.","ls.8.d":"Вспомни то, что недавно не вышло, и напиши одно предложение: что сделаешь иначе.","ls.9.t":"Момент между тем, что случилось, и тем, что я делаю","ls.9.b":"Между тем, что с тобой происходит, и тем, что ты делаешь, есть маленький момент. Реактивный его пропускает и отвечает на автомате. Проактивный использует его, чтобы выбрать. Случившееся не всегда можно изменить. Свою реакцию — можно.","ls.9.e":"Кто-то написал о тебе что-то обидное в общем чате. Автомат: сразу ответить со злостью. Выбор: остановиться, вдохнуть и решить, отвечать ли, когда и как.","ls.9.d":"В следующий раз, когда что-то разозлит, остановись на три вдоха и спроси себя: «Что я выбираю сделать сейчас?»","ac.t":"Достижения","ac.s":"Открываются по ходу — и каждое маленький праздник.","ac.got":"Открыто {n} из {t}","ac.locked":"В пути","ac.new":"Новое достижение: {x}","ac.1.t":"Первый шаг","ac.1.d":"Ты закрыл одну задачу","ac.2.t":"Три дня подряд","ac.2.d":"Ты возвращался три дня подряд","ac.3.t":"Первая цель","ac.3.d":"Ты поставил свою цель","ac.4.t":"Ты проявил инициативу","ac.4.d":"Ты закрыл вызов дня","ac.5.t":"Ты спланировал заранее","ac.5.d":"Ты закрыл недельную цель","ac.6.t":"Ты вернулся!","ac.6.d":"Ты вернулся и продолжил после перерыва в серии","ac.7.t":"Любознательный","ac.7.d":"Ты прочитал три урока","ac.8.t":"Знаешь себя","ac.8.d":"Ты прошёл чек-ин","ac.9.t":"Целая неделя","ac.9.d":"Семь дней подряд","ac.10.t":"Десять задач","ac.10.d":"Ты закрыл десять задач","n.hero.q1":"Разница между успехом и провалом — это расстояние между ","n.hero.q2":"кто-то должен это сделать","n.hero.q3":" и ","n.hero.q4":"я это делаю","n.hero.q5":".","n.hero.lead":"Твоё время начинать.","n.hero.sub2":"С этого момента ты тот (та), кем решишь быть.","n.hero.who":"Для подростков и любого возраста. Один маленький шаг в день.","n.hero.s1":"Минута вопросов — понять, где ты сейчас","n.hero.s2":"Выбрать одну цель","n.hero.s3":"Каждый день — один маленький шаг","n.hero.go":"Начать — одна минута","n.hero.cta":"Начнём","n.hero.note":"Без регистрации · Без почты · Всё остаётся на твоём устройстве","n.def.t":"Так что это, если по-простому?","n.def.b":"Проактивность — это заметить, что ты можешь сделать, — и сделать это по своей инициативе.","n.def.re":"Реактивно","n.def.pro":"Проактивно","n.sc.1.t":"Дедлайн через неделю","n.sc.1.r بادر: أن تسأل متى، وتفتح المادة اليوم.","ls.1.d":"{فكّر|فكّري} بشيء {تنتظره|تنتظرينه} الآن. ما الخطوة التي يمكنك اتخاذها دون انتظار؟","ls.2.t":"مبادر أم متفاعل","ls.2.b":"المتفاعل: تحدث لك الحياة {فتستجيب|فتستجيبين}. المبادر: {تقرّر|تقرّرين} أولاً ثم {تتصرّف|تتصرّفين}. كلاهما يفعل الأشياء نفسها تقريباً — لكن بترتيب معكوس.","ls.2.e":"تمتلئ ذاكرة هاتفك بالضبط حين تحتاج للتصوير. المتفاعل: يحذف في ذعر. المبادر: أفرغ مساحة الأسبوع الماضي.","ls.2.d":"{ابحث|ابحثي} عن شيء {تعرف|تعرفين} أنه سينفجر عليك بعد أسبوع. {امنحه|امنحيه} خمس دقائق اليوم.","ls.3.t":"كيف تتوقّف عن انتظار الحماس","ls.3.b":"الحماس لا يأتي قبل الفعل تقريباً أبداً. يأتي بعده. لست بحاجة لانتظار الرغبة — {ابدأ|ابدئي} بصغير، وستلحق بك الرغبة.","ls.3.e":"لا أحد يشعر بالحماس للركض تحت المطر. لكن بعد دقيقتين من الركض، آخر ما تريده هو التوقّف.","ls.3.d":"{اختر|اختاري} مهمة. {افعل|افعلي} منها دقيقتين دون أن {تسأل|تسألي} إن كنت {ترغب|ترغبين}.","ls.4.t":"كيف تبدأ وأنت بلا طاقة","ls.4.b":"حين لا تملك طاقة، المشكلة غالباً حجم المهمة لا طاقتك. صغّرها حتى تبدو سخيفة: ليس «رتّب غرفتي» بل «التقط خمسة أشياء عن الأرض».","ls.4.e":"واجب يبدو وكأنه ساعتان. افتح الدفتر فقط واكتب التاريخ. عادةً لن تتوقّف عند هذا.","ls.4.d":"{خذ|خذي} مهمة كبيرة أجّلتها {واكتب|واكتبي} أصغر نسخة منها. ثم {افعلها|افعليها}.","ls.5.t":"كيف تتعامل مع التسويف","ls.5.b":"التسويف غالباً هروب من شعور لا كسل: خوف من الفشل، ملل، أو ببساطة عدم وضوح البداية. حين تكون الخطوة الأولى صغيرة وواضحة، لا يبقى ما تهرب منه.","ls.5.e":"مهمة عليك تسليمها. {تتجنّبها|تتجنّبينها} أسبوعاً — لا لأنها صعبة، بل لأنك لا {تعرف|تعرفين} من أين {تبدأ|تبدئين}.","ls.5.d":"{اكتب|اكتبي} المهمة التي {تتجنّبها|تتجنّبينها} أكثر، ثم {اكتب|اكتبي} بجانبها أول سطر يمكنك كتابته فيها.","ls.6.t":"كيف تضع هدفاً يتحقّق فعلاً","ls.6.b":"الهدف الجيد يجيب على ثلاثة أسئلة: ماذا بالضبط، ومتى، وما الخطوة الأولى. «أتحسّن في كرة السلة» ليس هدفاً. «أسدّد 50 رمية حرة ثلاث مرات أسبوعياً حتى نهاية الشهر» هدف.","ls.6.e":"«أريد أن أصبح لائقاً» يبقى معلّقاً سنة. «أركض 20 دقيقة الثلاثاء والخميس» يبدأ يوم الثلاثاء.","ls.6.d":"{خذ|خذي} هدفاً في رأسك {وأضف|وأضيفي} إليه رقماً وتاريخاً.","ls.7.t":"كيف يتحوّل الهدف إلى عادة","ls.7.b":"تتكوّن العادة حين يحصل الفعل على مكان ثابت — الوقت نفسه، المكان نفسه، بعد الشيء نفسه. لن {تضطر|تضطري} للقرار كل يوم، وهذا بالضبط ما يوفّر الطاقة.","ls.7.e":"«سأقرأ حين يتوفّر الوقت» لا يحدث. «أقرأ عشر دقائق بعد تنظيف أسناني» يحدث تقريباً من تلقاء نفسه.","ls.7.d":"{اختر|اختاري} فعلاً واحداً {واربطه|واربطيه} بشيء {تفعله|تفعلينه} يومياً أصلاً.","ls.8.t":"حين لا ينجح شيء","ls.8.b":"الإخفاق معلومة لا حكم. السؤال الوحيد الذي يستحق: «ما الذي لم ينجح بالضبط؟» — لأن له إجابة، بخلاف «لماذا أنا هكذا».","ls.8.e":"أخفقت في امتحان. «أنا سيئ في الرياضيات» لا يفيد. «ذاكرت في الليلة السابقة فقط والصفحة الأخيرة فقط» — هذا شيء يمكن تغييره.","ls.8.d":"{فكّر|فكّري} بشيء لم ينجح مؤخراً، {واكتب|واكتبي} جملة واحدة: ما الذي {ستفعله|ستفعلينه} بشكل مختلف.","ls.9.t":"اللحظة بين ما يحدث وما أفعله","ls.9.b":"بين ما يحدث لك وما {تفعله|تفعلينه} لحظة صغيرة. ردّ الفعل يتخطّاها ويستجيب تلقائياً. المبادر يستخدمها ليختار. لا يمكن دائماً تغيير ما حدث، لكن يمكن تغيير ردّك.","ls.9.e":"كتب أحدهم عنك شيئاً مسيئاً في المجموعة. ردّ تلقائي: الردّ فوراً بغضب. اختيار: التوقّف، التنفّس، ثم تقرير هل تردّ ومتى وكيف.","ls.9.d":"في المرة القادمة التي يزعجك فيها شيء، {توقّف|توقّفي} ثلاثة أنفاس {واسأل|واسألي}: \"ماذا أختار أن أفعل الآن؟\"","ac.t":"الإنجازات","ac.s":"تُفتح أثناء تقدّمك، وكل واحد احتفال صغير.","ac.got":"فُتح {n} من {t}","ac.locked":"في الطريق","ac.new":"إنجاز جديد: {x}","ac.1.t":"الخطوة الأولى","ac.1.d":"أنهيت مهمة واحدة","ac.2.t":"ثلاثة أيام متتالية","ac.2.d":"عدت ثلاثة أيام متتالية","ac.3.t":"الهدف الأول","ac.3.d":"وضعت هدفاً خاصاً بك","ac.4.t":"بادرت بشيء","ac.4.d":"أنهيت تحدي اليوم","ac.5.t":"خطّطت مسبقاً","ac.5.d":"حققت هدفاً أسبوعياً في الجدول","ac.6.t":"عدت!","ac.6.d":"عدت وأكملت بعد توقّف في السلسلة","ac.7.t":"فضولي","ac.7.d":"قرأت ثلاثة دروس","ac.8.t":"تعرف نفسك","ac.8.d":"أكملت الاستبيان","ac.9.t":"أسبوع كامل","ac.9.d":"سبعة أيام متتالية","ac.10.t":"عشر مهام","ac.10.d":"أنهيت عشر /* ================= i18n runtime ================= */
var LANGS=['he','en','fr','ru','ar'], RTL={he:1,ar:1};
var cur = (function(){ try{var s=localStorage.getItem('proactive_lang');
  if(s&&I18N[s])return s;}catch(e){}
  var n=(navigator.language||'he').slice(0,2); return I18N[n]?n:'he'; })();

/* Grammatical gender lives INSIDE the string as {masculine|feminine} rather than
   in a parallel set of keys: '{אתה|את} {מתחיל|מתחילה}', 'בחר{|י}', 'prêt{|e}',
   'выбрал{|а}'. One string per key, so the two forms can never drift apart, and
   English simply contains no segments.

   ORDER MATTERS, and it is the opposite of what looks natural. Gender resolves
   FIRST, on the raw string straight out of the table, and only then are
   {placeholder} values substituted in. Several call sites pass text the user
   typed - a name, a goal title, a custom category - and if gender ran last, a
   user who typed "{a|b}" would have one of their own branches silently deleted.
   Resolving first is safe because a branch may not contain a brace, so no
   placeholder can ever hide inside one.

   Never resolve anywhere but here. esc() does not escape braces, so running
   this over an already-assembled HTML string could let one match span an
   attribute boundary. On the raw table string, before interpolation, it cannot. */
var GSEG=/\{([^{}|]*)\|([^{}|]*)\}/g;
var GENDERS=['m','f','n'];
var gnd=(function(){ try{
  var g=localStorage.getItem('proactive_gender');
  return GENDERS.indexOf(g)>=0 ? g : '';
}catch(e){ return ''; } })();

/* Hebrew and Arabic have no neutral second person. When the user has not said,
   the honest render is the slash form Israeli interfaces actually use -
   מתחיל/ה, בחר/י - built by keeping the shared prefix and appending only the
   part that differs. */
function gmerge(m,f){
  if(m===f) return m;
  if(!m) return f;
  if(!f) return m;
  var i=0;
  while(i<m.length && i<f.length && m.charAt(i)===f.charAt(i)) i++;
  var tail=f.slice(i);
  return (i>0 && tail && tail.length<=2) ? m+'/'+tail : m+'/'+f;
}
function gres(s){
  if(s.indexOf('|')<0) return s;
  return s.replace(GSEG, function(_,m,f){
    return gnd==='f' ? f : gnd==='m' ? m : gmerge(m,f);
  });
}
function t(k,vars){
  var s=(I18N[cur]&&I18N[cur][k]);
  if(s===undefined) s=(I18N.he&&I18N.he[k]);
  if(s===undefined) return k;
  s=gres(s);
  if(vars) for(var v in vars) s=s.split('{'+v+'}').join(vars[v]);
  return s;
}
function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
function ic(n,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#i-'+n+'"></use></svg>';}

function applyLang(){
  var dir = RTL[cur] ? 'rtl' : 'ltr';
  document.documentElement.lang = cur;
  document.documentElement.dir  = dir;
  document.querySelectorAll('.langbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.lang===cur); });
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){
    var s=t(el.dataset.i18nTitle); el.title=s; el.setAttribute('aria-label',s);
  });
  var mb=document.getElementById('modeBtn');
  if(mb) mb.setAttribute('data-i18n-title', activeTheme()==='light' ? 'th.dark' : 'th.light');
  document.title = t('seo.title');
  var md=document.querySelector('meta[name="description"]');
  if(md) md.setAttribute('content', t('seo.desc'));
  renderPrices();
  renderCheckout();
}
/* Everything drawn by JS must be redrawn, not just the [data-i18n] nodes.
   Language and gender both change every string on screen, so they share one
   path rather than each remembering its own list of things to repaint. */
function redrawAll(){
  applyLang();
  if(document.getElementById('app').style.display==='block') startApp();
  if(document.getElementById('onboarding').style.display==='block'){
    renderGoalOpts(); markSelected(); renderBuilt(); showStep(os);
  }
}

}

  if(GENDERS.indexOf(g)<0) return;
  gnd = g;

  try{ localStorage.setItem('proactive_gender', g); }catch(e){}

}

/* ================= age ================= */
/* The check-in asks a 14-year-old about school and a 40-year-old about work, so
   the band picks the wording. It is derived from P.age at render time and never
   cached: the user can go back from the questions, change their age, and come
   forward again, and the questions have to follow. */
/* The app is for ages 6 to 99. The bands below are keyed by their old
   names (a13 = the youngest band) because the key is stored in every save. */
var AGE_MIN=6, AGE_MAX=99;
var QBANDS=['a13','a18','a30','a50'];
function ageBand(a){
  var n=Number(a);
  if(!n || n<AGE_MIN) return 'a13';
  if(n<=17) return 'a13';
  if(n<=29) return 'a18';
  if(n<=49) return 'a30';
  return 'a50';
}

/* ================= workout builder ================= */
function reps(sets,n,unit){ return sets+'×'+n+(unit?' '+unit:''); }
function secs(n){ return n+' '+t('c.sec'); }
function mins(n){ return n+' '+t('c.min'); }

/* Two independent axes, where there used to be one "band" capped at 17-18.

   variant picks WHICH exercises (it still feeds every y / m2 / o ternary below,
   so none of the plan literals change); x scales HOW MUCH. Splitting them is
   what lets the plan serve a 70-year-old: 'young' is already the low-impact
   branch - knee push-ups, table rows, static lunges, fast squats instead of
   burpees - which is the right regression for a deconditioned older body, not
   just for a small one. A 13-18 year old gets exactly what they got before;
   10-12 gets the same low-impact branch, scaled down one more notch. */
function fitProfile(age){
  var a=Math.min(AGE_MAX, Math.max(AGE_MIN, Number(age)||15));
  if(a<=12) return {variant:'young', x:0.60, noteKey:'wo.n.a13'};
  if(a<=14) return {variant:'young', x:0.70, noteKey:'wo.n.a13'};
  if(a<=17) return {variant:'mid',   x:0.90, noteKey:'wo.n.a15'};
  if(a<=29) return {variant:'older', x:1.00, noteKey:'wo.n.a18'};
  if(a<=49) return {variant:'older', x:0.95, noteKey:'wo.n.a30'};
  if(a<=64) return {variant:'mid',   x:0.85, noteKey:'wo.n.a50'};
  return             {variant:'young', x:0.60, noteKey:'wo.n.a65'};
}
function buildWorkout(age,goal,level){
  var F=fitProfile(age), band=F.variant;
  /* Nobody over 50 gets handed four sets of burpees and pull-ups because they

/* ================= dimensions ================= */
var DIMS=[
 {id:'init', k:'dim.init',  icon:'rocket',   em:'🚀'},
 {id:'goal', k:'dim.goal',  icon:'target',   em:'🎯'},
 {id:'time', k:'dim.time',  icon:'clock',    em:'⏱️'},
 {id:'solve',k:'dim.solve', icon:'brain',    em:'🧠'},
 {id:'plan', k:'dim.plan',  icon:'calendar', em:'📅'},
 {id:'choice',k:'dim.choice',icon:'compass', em:'🧭', lesson:9}
];
function dimById(id){ for(var i=0;i<DIMS.length;i++) if(DIMS[i].id===id) return DIMS[i]; return DIMS[0]; }

/* Twelve questions, two per dimension. The four numbers are what each answer is
   worth, in the option order a-b-c-d. They are not a grade - they only decide
   which area the app leans on when it suggests something. */
var QUESTIONS=[
 {n:1,  dim:'time',  v:[100,40,15,60]},
 {n:2,  dim:'init',  v:[100,55,20,70]},
 {n:3,  dim:'goal',  v:[100,60,35,15]},
 {n:4,  dim:'plan',  v:[95,65,35,15]},
 {n:5,  dim:'solve', v:[95,65,25,15]},
 {n:6,  dim:'init',  v:[100,60,30,15]},
 {n:7,  dim:'goal',  v:[100,70,40,20]},
 {n:8,  dim:'plan',  v:[100,65,35,15]},
 {n:9,  dim:'solve', v:[100,65,40,15]},
 {n:10, dim:'time',  v:[100,80,30,15]},
 {n:11, dim:'choice',v:[100,45,25,55]},
 {n:12, dim:'choice',v:[100,35,15,55]}
];
var QLETTERS=['a','b','c','d'];

/* Four of the ten can honestly be true in more than one way at once - "I start
   a few days early" AND "it depends how much I care about the subject" are not
   contradictory, and forcing one of them is asking the user to lie. The other
   six ask for a single thing (what is your FIRST step, how tidy is your bag)
   and stay single-choice, so eight of the twelve screens still advance on one
   tap with no Continue to press. */
var MULTI_Q={1:true, 2:true, 9:true, 10:true};

/* Two closing questions that are multi-answer by nature and carry no score:
   they shape what the app suggests, not where the user sits on a scale. Both
   reuse the goal chain's own option sets, so there is nothing new to translate
   and the answers feed straight into the chain that follows. */
var QPROFILE=[{id:'areas', k:'qz.p.areas'}, {id:'blocks', k:'qz.p.blocks'}];
function profileOpts(id){
  if(id==='areas') return AREAS.map(function(a){ return {v:a.id, label:t('ga.'+a.id), icon:a.icon}; });
  return OBSTACLES.map(function(o){ return {v:o, label:t('go.'+o), icon:null}; });
}
function profilePicks(id){
  if(!S.quiz) return [];
  if(!S.quiz[id]) S.quiz[id]=[];
  return S.quiz[id];
}

/* Screen 0 is the age. It is asked here rather than only in setup because the
   age is what picks the wording of every question below it, and a retake used
   to re-ask ten questions worded for whatever age was typed months ago with no
   way to correct it. */
function qTotal(){ return QUESTIONS.length + QPROFILE.length; }
function screenAt(i){
  if(i<=0) return {kind:'age'};
  if(i<=QUESTIONS.length) return {kind:'q', Q:QUESTIONS[i-1]};
  return {kind:'p', P:QPROFILE[i-1-QUESTIONS.length]};
}
function lastScreen(){ return qTotal(); }

/* Question text is looked up per age band. This probes I18N.he rather than
   t(), because t() returns the key on a miss and so cannot say "missing"; and a
   key present in I18N.he is present in all five languages, since build.py
   rejects any key with fewer. The fallback to a13 is belt and braces - build.py
   already fails on a band with a hole in it. */
function qk(band,n,part){
  var k='qz.'+band+'.'+n+'.'+part;
  return (I18N.he && I18N.he[k]!==undefined) ? k : 'qz.a13.'+n+'.'+part;
}
function quizBand(){ return ageBand(P.age); }

/* band records which wording the answers were given against. The scores stay
   valid across bands - question number -> dimension -> score vector does not
   depend on wording - so a changed age never throws a profile away; it only
   offers a retake. */
function emptyQuiz(){ return {answers:{}, areas:[], blocks:[], scores:null, i:0, done:false, band:null}; }

/* ================= scoring ================= */
/* An answer is a letter, or - on a multi question - a list of them, and a list
   scores the mean of what was picked. One selection therefore scores exactly
   what it scored before this existed, which is what keeps a new check-in
   comparable with every entry already in the history. */
function answerValue(Q, pick){
  if(pick===undefined || pick===null) return null;
  var list = (pick instanceof Array) ? pick : [pick];
  var sum=0, n=0;
  list.forEach(function(L){
    var ix=QLETTERS.indexOf(L);
    if(ix>=0){ sum+=Q.v[ix]; n++; }
  });
  return n ? sum/n : null;
}
function scoreQuiz(){
  var q=S.quiz||emptyQuiz(), sum={}, count={};
  DIMS.forEach(function(d){ sum[d.id]=0; count[d.id]=0; });
  QUESTIONS.forEach(function(Q){
    var v=answerValue(Q, q.answers[Q.n]);
    if(v===null) return;
    sum[Q.dim]+=v; count[Q.dim]++;
  });
  /* a dimension with no answer is left out rather than scored 0: a profile
     made before the choice questions existed has not measured choice */
  var out={};
  DIMS.forEach(function(d){
    if(count[d.id]) out[d.id]=Math.round(sum[d.id]/count[d.id]);
  });
  return out;
}
function quizAnswered(){
  var q=S.quiz||{}, n=0;
  QUESTIONS.forEach(function(Q){
    if(q.answers && answerValue(Q,q.answers[Q.n])!==null) n++;
  });
  return n;
}
function hasProfile(){ return !!(S.quiz && S.quiz.scores); }
function measured(){ return DIMS.filter(function(d){ return hasProfile() && typeof S.quiz.scores[d.id]==='number'; }); }
function profileIndex(){
  var ds=measured(); if(!ds.length) return 0;
  var t=0; ds.forEach(function(d){ t+=S.quiz.scores[d.id]; });
  return Math.round(t/ds.length);
}
function bandKey(v){ return v>=80?'rs.b4' : v>=65?'rs.b3' : v>=40?'rs.b2' : 'rs.b1'; }

/* Ties resolve by DIMS order rather than by whichever key the engine happens to
   walk first, so the same answers always produce the same profile text. */
function extremeDim(want){
  var ds=measured();
  if(!ds.length) return DIMS[0].id;
  var best=ds[0].id, bv=S.quiz.scores[ds[0].id];
  ds.forEach(function(d){
    var v=S.quiz.scores[d.id];
    if(want==='high' ? v>bv : v<bv){ bv=v; best=d.id; }
  });
  return best;
}
function strongDim(){ return extremeDim('high'); }
function weakDim(){ return extremeDim('low'); }

/* The check-in is also what sets the challenge level, so someone who is
   already organised is not handed beginner-sized tasks and someone who is
   drowning is not handed a wall of them. */
function applyProfileToPlan(){
  var v=profileIndex();
  P.diff = v>=72 ? 'hard' : v>=45 ? 'mid' : 'easy';
}

/* ================= the check-in screen ================= */
/* A single-choice option is a radio in all but name; a multi one is a checkbox
   and must say so to a screen reader, or the only thing telling anyone they may
   pick two is a line of small print. */
function optRow(opts){
  var cls='qz-opt'+(opts.multi?' multi':'')+(opts.on?' on':'');
  var a11y = opts.multi
    ? 'role="checkbox" aria-checked="'+(opts.on?'true':'false')+'"'
    : 'aria-pressed="'+(opts.on?'true':'false')+'"';
  var badge = opts.icon ? ic(opts.icon) :
    '<span class="qz-let" aria-hidden="true">'+String(opts.letter||'').toUpperCase()+'</span>';
  return '<button class="'+cls+'" type="button" data-qa="'+opts.v+'" '+a11y+'>'+
    badge+'<span class="qz-tx">'+esc(opts.label)+'</span>'+
    '<span class="qz-tick" aria-hidden="true">'+ic('check')+'</span></button>';
}
function picksFor(Q){
  var p=S.quiz.answers[Q.n];
  if(p===undefined||p===null) return [];
  return (p instanceof Array) ? p.slice() : [p];
}

function renderQuiz(){
  if(!S.quiz) S.quiz=emptyQuiz();
  var i=Math.min(Math.max(0,S.quiz.i), lastScreen());
  S.quiz.i=i;
  var sc=screenAt(i), total=qTotal();

  /* the age screen is a preamble, not question 1 of 12 */
  var count=document.getElementById('qzCount');
  if(count) count.textContent = (i===0) ? '' : t('qz.count',{n:i,t:total});
  var bar=document.getElementById('qzBar');
  if(bar) bar.style.width=Math.round(Math.max(i,0.4)/total*100)+'%';
  /* The overlay header keeps showing where the user is in SETUP; the question
     counter lives inside the card. Printing the question count in both places
     read as two different progress bars for the same thing. */
  var top=document.getElementById('stepCount');
  if(top) top.textContent=t('o.step',{n:4,t:ONB_TOTAL});
  var onb=document.getElementById('onbBar');
  if(onb) onb.style.width=Math.round((3+Math.max(i,0)/total)/ONB_TOTAL*100)+'%';
  var intro=document.getElementById('qzIntro');
  if(intro) intro.hidden = i>0;

  var ageBox=document.getElementById('qzAge'), body=document.getElementById('qzBody');
  if(ageBox) ageBox.hidden = (sc.kind!=='age');
  if(body)   body.hidden   = (sc.kind==='age');

  var prev=document.getElementById('qzPrev');
  /* opened from inside the app, the first screen's Back is the way out */
  if(prev) prev.style.visibility = (i===0 && onbActive) ? 'hidden' : 'visible';

  if(sc.kind==='age'){ renderQuizAge(); return; }

  var multi = (sc.kind==='p') || !!MULTI_Q[sc.Q && sc.Q.n];
  var tag=document.getElementById('qzDim');
  if(tag) tag.textContent = (sc.kind==='q') ? t(dimById(sc.Q.dim).k) : '';
  var hint=document.getElementById('qzMulti');
  if(hint) hint.hidden = !multi;

  var rows, chosen;
  if(sc.kind==='q'){
    document.getElementById('qzQ').textContent=t(qk(quizBand(),sc.Q.n,'q'));
    chosen=picksFor(sc.Q);
    rows=QLETTERS.map(function(L){
      return optRow({v:L, letter:L, label:t(qk(quizBand(),sc.Q.n,L)),
                     multi:multi, on:chosen.indexOf(L)>=0});
    });
  } else {
    document.getElementById('qzQ').textContent=t(sc.P.k);
    chosen=profilePicks(sc.P.id);
    rows=profileOpts(sc.P.id).map(function(o){
      return optRow({v:o.v, label:o.label, icon:o.icon, multi:true, on:chosen.indexOf(o.v)>=0});
    });
  }
  var box=document.getElementById('qzOpts');
  box.innerHTML=rows.join('');
  box.querySelectorAll('[data-qa]').forEach(function(b){
    b.addEventListener('click',function(){ pickQuiz(b.dataset.qa); });
  });
  renderQuizNext();
}

/* Single-choice keeps advancing on the tap itself. A multi screen cannot, so it
   grows a Continue button - disabled until something is chosen, because an
   empty answer is not an answer. */
function renderQuizNext(){
  var btn=document.getElementById('qzNext'); if(!btn) return;
  var sc=screenAt(S.quiz.i);
  if(sc.kind==='age'){
    btn.hidden=false;
    btn.disabled = !ageOK(document.getElementById('qAge'));
    return;
  }
  var multi = (sc.kind==='p') || !!MULTI_Q[sc.Q && sc.Q.n];
  btn.hidden = !multi;
  if(!multi) return;
  var n = (sc.kind==='p') ? profilePicks(sc.P.id).length : picksFor(sc.Q).length;
  btn.disabled = n===0;
}

function ageOK(el){
  var n=parseInt(el&&el.value,10);
  return n>=AGE_MIN && n<=AGE_MAX;
}
function renderQuizAge(){
  var el=document.getElementById('qAge');
  if(el && !el.value && P.age) el.value=P.age;
  /* No band label. The age decides the wording of every question below, but
     telling someone which bucket they landed in is the one thing the owner
     asked the site never to say. The button turning live is the feedback. */
  renderQuizNext();
}
function bindQuizAge(){
  var el=document.getElementById('qAge');
  if(el) el.addEventListener('input', renderQuizAge);
  var btn=document.getElementById('qzNext');
  if(btn) btn.addEventListener('click', nextQuiz);
}

/* One tap: single-choice answers and moves on, multi toggles and waits. */
function pickQuiz(v){
  var sc=screenAt(S.quiz.i);
  if(sc.kind==='p'){
    var list=profilePicks(sc.P.id), at=list.indexOf(v);
    if(at>=0) list.splice(at,1); else list.push(v);
    saveQuiz(); renderQuiz(); return;
  }
  var Q=sc.Q;
  if(MULTI_Q[Q.n]){
    var picks=picksFor(Q), ix=picks.indexOf(v);
    if(ix>=0) picks.splice(ix,1); else picks.push(v);
    S.quiz.answers[Q.n]=picks;
    S.quiz.band=quizBand();
    saveQuiz(); renderQuiz(); return;
  }
  S.quiz.answers[Q.n]=v;
  S.quiz.band=quizBand();
  saveQuiz();
  nextQuiz();
}
function nextQuiz(){
  var sc=screenAt(S.quiz.i);
  if(sc.kind==='age'){
    var el=document.getElementById('qAge');
    if(!ageOK(el)){ toast(t('t.agerange')); return; }
    P.age=String(parseInt(el.value,10));
    save();
  }
  if(S.quiz.i < lastScreen()){ S.quiz.i++; saveQuiz(); renderQuiz(); }
  else finishQuiz();
}
/* kept: other modules and older handlers still call answerQuiz(letter) */
function answerQuiz(letter){ pickQuiz(letter); }
function finishQuiz(){
  S.quiz.scores=scoreQuiz();
  S.quiz.done=true;
  S.quiz.band=quizBand();
  recordCheckin();
  applyProfileToPlan();
  /* CH is built at boot, before any of this was known. If it is still
     untouched, rebuild it so the chain opens on what was just said. */
  if(typeof CH==='object' && CH && CH.step===0 && !CH.area){ CH=emptyChain(); saveChain(); }
  saveQuiz();
  unlock('ach.quiz');
  if(document.getElementById('onboarding').style.display==='block'){
    showStep(5);
  } else {
    renderProfile('profBody');
    toast(t('rs.updated'));
  }
}
/* The check-in runs before onboarding finishes, i.e. before save() is allowed
   to write a profile, so its answers get their own key and are folded back in
   by load(). Losing ten answers to a mistimed refresh would be the one thing
   nobody would re-enter. */
function saveQuiz(){
  try{ localStorage.setItem('proactive_quiz', JSON.stringify(S.quiz)); }catch(e){}
}
function loadQuiz(){
  try{
    var raw=localStorage.getItem('proactive_quiz');
    if(raw){
      var q=JSON.parse(raw);
      if(q && q.answers){
        if(!q.band) q.band='a13';   // every save before bands existed was teen-worded
        /* Before the age screen existed, index 0 WAS question 1. Shift a
           part-finished quiz forward so it resumes on the same question rather
           than throwing the user back to the start. */
        if(q.areas===undefined && typeof q.i==='number') q.i=q.i+1;
        if(!q.areas)  q.areas=[];
        if(!q.blocks) q.blocks=[];
        S.quiz=q;
      }
    }
  }catch(e){}
  if(!S.quiz) S.quiz=emptyQuiz();
}
function restartQuiz(){
  S.quiz=emptyQuiz(); saveQuiz();
}

/* ================= check-in history =================
   A retake used to overwrite the result and the earlier one was simply gone,
   which threw away the only thing the app could ever show that really moves
   someone: proof they changed. Recorded for everybody - the chart that reads it
   may be a Pro view, but the data is the user's and is never not kept. */
function recordCheckin(){
  if(!S.hist) S.hist=[];
  var sc=S.quiz.scores||{};
  var last=S.hist[S.hist.length-1];
  var entry={d:dayKey(), band:S.quiz.band||'a13', s:{}};
  DIMS.forEach(function(d){ if(typeof sc[d.id]==='number') entry.s[d.id]=sc[d.id]; });
  /* two goes at the same check-in on one day is one data point, the later one */
  if(last && last.d===entry.d) S.hist[S.hist.length-1]=entry;
  else S.hist.push(entry);
  if(S.hist.length>60) S.hist=S.hist.slice(-60);
  save();
}
function checkinAvg(e){
  var ks=Object.keys(e.s); if(!ks.length) return 0;
  var t=0; ks.forEach(function(k){ t+=e.s[k]|0; });
  return Math.round(t/ks.length);
}
function daysSinceCheckin(){
  if(!S.hist||!S.hist.length) return 0;
  return daysBetween(S.hist[S.hist.length-1].d, dayKey());
}

  if(!S.ach) S.ach={};
  if(S.ach[id]) return false;
  S.ach[id]=dayKey();
  save();
  var a=null;
  ACHV.forEach(function(x){ if(x.id===id) a=x; });
  if(a) toast(t('ac.new',{x:t('ac.'+a.n+'.t')}));
  renderAchievements();
  return true;
}

  if(!S.ach) S.ach={};

    var ok=false;
    try{ ok=a.test(); }catch(e){ ok=false; }

/* Local calendar day, not UTC - with UTC the day would roll over at the wrong
   hour and break every streak for anyone not on GMT. */
function dayKey(d){
  d = d || new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetween(a,b){
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
}
/* Shared by the sport and skincare mini-apps: same day is a no-op, yesterday
   extends the run. One missed day is forgiven once per run - a month of work
   should not be wiped out by a single bad Tuesday, which is the moment most
   people stop opening the app for good. A second miss does reset it: a streak
   that can never break is not a streak. */
function bumpStreak(o,day){
  day = day || dayKey();
  if(o.lastDay === day) return o.streak;
  var gap = o.lastDay ? daysBetween(o.lastDay, day) : 0;
  if(!o.lastDay){ o.streak=1; o.grace=0; }
  else if(gap === 1){ o.streak=(o.streak||0)+1; }
  else if(gap === 2 && !o.grace){ o.streak=(o.streak||0)+1; o.grace=1; }
  else { o.streak=1; o.grace=0; }
  o.lastDay = day;
  return o.streak;
}
/* A run that was broken before today should read as 0, not as its stale value.
   A run with one day missed and the grace still unspent is not broken yet: act
   today and it carries on, so it keeps showing. */
function liveStreak(o){
  if(!o || !o.lastDay) return 0;
  var gap = daysBetween(o.lastDay, dayKey());
  if(gap === 0 || gap === 1) return o.streak||0;
  if(gap === 2 && !o.grace) return o.streak||0;
  return 0;
}
/* True while one missed day can still be rescued by acting today. */
function streakRescuable(o){
  if(!o || !o.lastDay || o.grace) return false;
  return daysBetween(o.lastDay, dayKey()) === 2;
}

var STORE_V=4;
/* The profile is written only once setup finishes. Anything that fires during
   onboarding - an achievement unlocking off the check-in, a tip - must not
   persist a half-built profile, or a refresh drops the user into the app with
   steps still unfinished. The look, the answers and the chain each have their
   own key and are unaffected. */
function save(){ try{
  if(onbActive) return;
  saveLook();
  if(GENDERS.indexOf(P.gender)>=0) localStorage.setItem('proactive_gender', P.gender);
  localStorage.setItem('proactive_v',STORE_V);
  localStorage.setItem('proactive_p',JSON.stringify(P));
  localStorage.setItem('proactive_s',JSON.stringify(S));
  localStorage.setItem('proactive_uid',uid);
}catch(e){ if(typeof warnQuota==='function') warnQuota(); } }

/* ids must never collide with ids already sitting in storage, whatever their
   origin - a stale counter silently makes one checkbox toggle another row. */
function reseedUid(){
  var max=0;
  function seen(n){ n=Number(n); if(n>max) max=n; }
  (S.tasks||[]).forEach(function(x){ seen(x.id); });
  (S.missions||[]).forEach(function(x){ seen(x.id); });
  (S.goals||[]).forEach(function(g){ seen(g.id); (g.actions||[]).forEach(function(a){ seen(a.id); }); });
  (P.customCats||[]).forEach(function(c){ var m=/^custom_(\d+)$/.exec(c.id||''); if(m) seen(m[1]); });
  var stored=Number(localStorage.getItem('proactive_uid'))||1;
  uid=Math.max(stored,max+1,1);
}

/* v1 stored every task, mission and category label as a hardcoded Hebrew
   string and category icons as emoji, so carrying that straight into the new
   build leaves Hebrew text in the other four languages and icon references
   that resolve to nothing. Keep the progress, rebuild the labelled parts. */
function migrateV1(){
  P.customCats=(P.customCats||[]).map(function(c){
    return {id:c.id, name:c.name, icon:'star', custom:true, sg:['sg.generic']};
  });
  P.easy=[]; P.hard=[];                 // v1 stored these as Hebrew literals
  S.tasks=[]; S.missions=[]; S.plan={}; // re-seeded below from the new schema
  S.goals=(S.goals||[]).map(function(g){
    return {id:g.id, title:g.title,     // the user typed these, so they stay
            actions:guessSteps(g.title).map(function(k){
              return {id:0,key:k,text:'',done:false};
            })};
  });
  if(!P.trialStart) P.trialStart=Date.now();
}

/* v2 predates the mini-apps. Additive only: nothing stored by v2 is touched. */
function migrateV2(){
  if(!S.mini) S.mini=emptyMini();
}

/* Fields the v4 schema adds. Object.assign in load() merges a stored save over
   the defaults, so a v3 save arrives with these already present (as defaults);
   this only backfills a save that was hand-edited or partially written. */
/* Goals made by the chain used to be named "<what> · <how often>". The how
   often is on the goal already, so the suffix comes off - in whichever
   language the goal was made - and the weekly mission follows the name. */
function tidyGoalTitles(){
  (S.goals||[]).forEach(function(g){
    if(!g.freq || !g.title) return;
    Object.keys(I18N).forEach(function(l){
      var f=I18N[l]['gf.'+g.freq], suf=' · '+f;
      if(f && g.title.length>suf.length && g.title.slice(-suf.length)===suf){
        var old=g.title; g.title=g.title.slice(0,-suf.length);
        (S.missions||[]).forEach(function(m){ if(m.goalId===g.id && m.title===old) m.title=g.title; });
      }
    });
  });
}
function ensureV4Fields(){
  if(!S.quiz) S.quiz=emptyQuiz();
  if(!S.lessons) S.lessons={};
  if(!S.ach) S.ach={};
  if(!S.tips) S.tips={};
  if(!S.hist) S.hist=[];
  if(S.quiz){ if(!S.quiz.areas) S.quiz.areas=[]; if(!S.quiz.blocks) S.quiz.blocks=[]; }
  if(S.mini && S.mini.skin && typeof migrateRoutine==='function') migrateRoutine(S.mini.skin);
  if(!S.day) S.day={streak:0,lastDay:null};
  if(!S.ref) S.ref=emptyRef();          /* the referral code and what it earned */
  if(!S.stats) S.stats={tasksDone:0, challenges:0, comebacks:0, bestStreak:0};
  /* Goals made before the start gate existed were tracked from the day they
     were written, so they count as started - anything else would silently
     stop a streak someone already has. */
  (S.goals||[]).forEach(function(g){ if(g.started===undefined){ g.started=true; g.startedAt=g.startedAt||null; } });
}

/* v3 predates the check-in, the lessons, the achievements and the real day
   streak. Additive only: nothing stored by v3 is touched. The old S.streak
   counted ticks rather than days, so it seeds stats.tasksDone - which is what
   it actually measured - and the day streak starts fresh instead of inheriting
   a number that never meant days. */
function migrateV3(){
  ensureV4Fields();
  S.stats.tasksDone = Number(S.streak)||0;
}

/* Every real action routes through here: it is the single place that decides
   the day streak, so nothing can bump it twice in one day and a missed day
   simply starts a new run instead of "failing". */
function markActiveToday(){
  if(!S.day) S.day={streak:0,lastDay:null};
  var day=dayKey();
  if(S.day.lastDay===day) return;
  var gap = S.day.lastDay ? daysBetween(S.day.lastDay,day) : 0;
  var broke = S.day.lastDay && (gap>2 || (gap===2 && S.day.grace));
  bumpStreak(S.day,day);
  if(broke) S.stats.comebacks=(S.stats.comebacks||0)+1;
  S.stats.bestStreak=Math.max(S.stats.bestStreak||0, S.day.streak||0);
  save();
  if((S.day.streak||0)>=3 && typeof tip==='function') tip('streak');
}
function shownStreak(){ return liveStreak(S.day); }
function streakLine(){
  var n=shownStreak();
  if(streakRescuable(S.day)) return t('d.sk.rescue',{n:n});
  if(n<=0 && S.day && S.day.lastDay) return t('d.sk.miss');
  return n<=0 ? t('d.sk.0') : n===1 ? t('d.sk.1') : t('d.sk.n',{n:n});
}

function load(){ try{
  var p=localStorage.getItem('proactive_p'), s=localStorage.getItem('proactive_s');
  if(!p||!s) return false;
  var pp=JSON.parse(p);
  /* A profile written before Pro existed has no `founder` field at all. Those
     people were promised a free app and got one, so they keep every feature for
     good - checked before the merge, because the default would mask it. */
  var grandfather = !('founder' in pp);
  P=Object.assign(P,pp); S=Object.assign(S,JSON.parse(s));
  if(grandfather) P.founder=true;
  reseedUid();                          // before anything hands out a new id
  var v=Number(localStorage.getItem('proactive_v'))||1;
  if(v<2){
    migrateV1();
    buildCats();
    seedTasks(); seedMissions();        // rebuilt in the new shape; goals kept
    S.goals.forEach(function(g){
      g.id=uid++; g.actions.forEach(function(a){ a.id=uid++; });
    });
  }
  if(v<3) migrateV2();                  // chains, so a v1 save lands on v4
  if(v<4) migrateV3();
  if(!S.mini) S.mini=emptyMini();       // belt and braces for a hand-edited save
  ensureV4Fields();
  tidyGoalTitles();
  loadQuiz();                           // answers saved before onboarding ended
  if(v<STORE_V) save();
  return true;
}catch(e){ return false; } }

/* A short burst of confetti and a light buzz for the moments that matter:
   all three things done, a goal's step done, a level up, the week written
   up. Nothing for every tick - a celebration that happens all the time
   stops being one. Skipped when the device asks for reduced motion. */
function celebrate(){
  try{ if(navigator.vibrate) navigator.vibrate(35); }catch(e){}
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var host=document.createElement('div'); host.className='confetti'; host.setAttribute('aria-hidden','true');
  var cols=['#3D7B5E','#8DB86E','#D99A26','#FF7FB0','#3DDCA8'];

    p.style.left=(Math.random()*100)+'%';
    p.style.background=cols[i%cols.length];
    p.style.animationDelay=(Math.random()*.25)+'s';
