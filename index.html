/* ================= billing =================
   One block to configure; the whole card flow is already written around it.
   See PAYMENTS.md at the repository root for where each value comes from.

   `token` and `prices` are the card form. With them set, Paddle's own card
   fields open *inside this page* - no redirect to someone else's site. The
   token is a client-side token: it is designed to be published in front-end
   code, it can only start a checkout, and it cannot read or move money, which
   is why it can sit in a public repository.

   `licProvider` is the separate, optional licence-key path. A provider that
   issues keys (Lemon Squeezy) lets a buyer restore Pro on a second device and
   lets this page verify the subscription against the provider for real. Paddle
   has no licence API a browser can call, so with Paddle alone the key box stays
   hidden instead of pretending to check something.

   While `token` is empty the app runs in OPEN mode: nothing is locked, no
   upsell appears anywhere, paddle.js is never even fetched, and the pricing
   section says plainly that payment is not open yet. Gating a feature when
   nobody can possibly pay would just be taking the app away from people. */
var BILLING={
  provider:'paddle',
  token:'',                              /* client-side token: live_... / test_... */
  env:'production',                      /* 'sandbox' while you are testing */
  prices:{monthly:'', annual:''},        /* pri_... ids from the Paddle catalogue */
  portal:'',                             /* "manage my subscription" page */
  licProvider:''                         /* '' | 'lemonsqueezy' */
};
var PADDLE_JS='https://cdn.paddle.com/paddle/v2/paddle.js';
var GOAL_FREE_MAX=3;                     /* active targets on the free tier */
/* The one address on the site. Until checkout is configured this is how someone
   who wants to pay actually reaches you; after it, it is where questions go. */
var CONTACT_EMAIL='ben.mor.04.2012@gmail.com';

/* A price with no token cannot charge anything, and a token with no price has
   nothing to sell, so both have to be there before a buy button appears. */
function billingOn(){ return !!(BILLING.token && (BILLING.prices.monthly||BILLING.prices.annual)); }
function licOn(){ return !!(BILLING.licProvider && LICENSE_ADAPTERS[BILLING.licProvider]); }

/* ================= licence =================
   Lemon Squeezy's License API takes no secret key and answers CORS, so a page
   with no server behind it can still ask the provider whether a subscription is
   really live. That is the whole reason this is a licence key and not a
   "?paid=1" flag in the URL: one can be checked, the other cannot. */
var LIC={key:'', inst:'', ok:false, exp:null, checked:0};

function loadLic(){
  try{
    var raw=localStorage.getItem('proactive_lic');
    if(raw){ var j=JSON.parse(raw); if(j&&typeof j==='object') LIC=Object.assign(LIC,j); }
  }catch(e){}
}
function saveLic(){ try{ localStorage.setItem('proactive_lic', JSON.stringify(LIC)); }catch(e){} }

function licExpired(){
  if(!LIC.exp) return false;
  var t0=Date.parse(LIC.exp);
  return !isNaN(t0) && Date.now()>t0;
}
/* Verified once, then trusted offline until it expires - an app that stops
   working on a train is worse than one that trusts a paying customer. */
function licActive(){ return !!(LIC.ok && LIC.key && !licExpired()); }

function lsPost(op, data){
  var body=Object.keys(data).filter(function(k){ return data[k]; })
    .map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(data[k]); }).join('&');
  return fetch('https://api.lemonsqueezy.com/v1/licenses/'+op, {
    method:'POST',
    headers:{'Accept':'application/json','Content-Type':'application/x-www-form-urlencoded'},
    body:body
  }).then(function(r){ return r.json(); });
}
/* Every provider answers in its own shape; everything above this line speaks
   one shape. Swapping to Paddle or Stripe later is another adapter, not a
   rewrite of the app. */
var LICENSE_ADAPTERS={
  lemonsqueezy:{
    activate:  function(key,name){ return lsPost('activate',  {license_key:key, instance_name:name}); },
    validate:  function(key,inst){ return lsPost('validate',  {license_key:key, instance_id:inst}); },
    deactivate:function(key,inst){ return lsPost('deactivate',{license_key:key, instance_id:inst}); },
    norm: function(j){
      var lk=(j&&j.license_key)||{};
      var live = lk.status ? (lk.status==='active') : true;
      return {
        ok:  !!(j && (j.activated || j.valid || j.deactivated) && live),
        exp: lk.expires_at || null,
        inst:(j && j.instance && j.instance.id) || '',
        err: (j && j.error) || null
      };
    }
  }
};
function licAdapter(){ return LICENSE_ADAPTERS[BILLING.licProvider] || LICENSE_ADAPTERS.lemonsqueezy; }
function deviceName(){
  var n=(P.name||'').trim();
  return (n? n+' · ':'')+'proactivity-'+(navigator.platform||'web');
}

function activateLicense(key){
  var a=licAdapter();
  return a.activate(String(key||'').trim(), deviceName()).then(function(j){
    var r=a.norm(j);
    if(!r.ok) return {ok:false, err:r.err||t('pro.lic.bad')};
    LIC={key:String(key).trim(), inst:r.inst, ok:true, exp:r.exp, checked:Date.now()};
    saveLic(); return {ok:true};
  }).catch(function(){ return {ok:false, err:t('pro.lic.net')}; });
}
function releaseLicense(){
  var a=licAdapter(), key=LIC.key, inst=LIC.inst;
  LIC={key:'', inst:'', ok:false, exp:null, checked:0}; saveLic();
  if(key&&inst) { try{ a.deactivate(key,inst).catch(function(){}); }catch(e){} }
}
/* A dead network is not a verdict: only the provider actually saying "no"
   revokes access. */
var LIC_RECHECK_MS=7*86400000;
function revalidateLicense(){
  if(!licOn() || !LIC.key || !LIC.ok) return;
  if(Date.now()-(LIC.checked||0) < LIC_RECHECK_MS) return;
  var a=licAdapter();
  a.validate(LIC.key, LIC.inst).then(function(j){
    var r=a.norm(j);
    LIC.checked=Date.now();
    if(r.exp) LIC.exp=r.exp;
    if(!r.ok){ LIC.ok=false; }
    saveLic();
    if(!r.ok && typeof redrawAll==='function') redrawAll();
  }).catch(function(){});
}

/* ================= paid on this device =================
   What the browser itself saw: Paddle told this page, in this tab, that the
   payment went through. It is kept in its own storage key so it survives a
   profile reset, and it is deliberately not mixed into the profile - someone
   can pay from the pricing section before they have set anything up.

   Be clear about what this is worth: it is a flag on the device, so it cannot
   notice a later cancellation and a determined person could write it by hand.
   That is the known limit of a page with no server behind it, and the licence
   key above is the path that is actually verified. */
var PAID={txn:'', at:0, plan:''};
function loadPaid(){
  try{
    var raw=localStorage.getItem('proactive_pay');
    if(raw){ var j=JSON.parse(raw); if(j&&typeof j==='object') PAID=Object.assign(PAID,j); }
  }catch(e){}
}
function savePaid(){ try{ localStorage.setItem('proactive_pay', JSON.stringify(PAID)); }catch(e){} }
function paidHere(){ return !!PAID.txn; }
/* Is there a save on this device at all? Buying from the pricing section
   happens before any setup, and writing a profile just because someone pressed
   "pay" would drop them into a half-built app on their next visit. */
function savedProfile(){ try{ return !!localStorage.getItem('proactive_p'); }catch(e){ return false; } }

/* ================= who gets what ================= */
function proState(){
  if(!billingOn())        return 'open';     /* payment not configured at all */
  if(P.founder)           return 'founder';  /* here before Pro existed */
  if(licActive())         return 'pro';
  if(paidHere())          return 'pro';
  if(trialDaysLeft()>0)   return 'trial';
  return 'free';
}
function isPro(){ return proState()!=='free'; }
function goalLimitReached(){
  if(isPro()) return false;
  return (S.goals||[]).filter(function(g){ return !g.archived; }).length >= GOAL_FREE_MAX;
}

/* A lock is never a dead end: it says what the thing is and offers the way in. */
function lockHtml(whatKey){
  return '<div class="lockcard">'+ic('lock')+
    '<h3>'+esc(t('pro.lock.t'))+'</h3>'+
    '<p>'+esc(t(whatKey))+'</p>'+
    '<button class="btn btn-primary" data-go-plans>'+esc(t('pro.lock.cta'))+'</button>'+
    '<button class="btn btn-ghost btn-sm" data-lic-open>'+esc(t('pro.have'))+'</button>'+
    '</div>';
}

/* ================= the card form =================
   Paddle's inline checkout puts Paddle's own iframe inside an element on this
   page. The card number is typed here, on this site, but it is entered into
   Paddle's frame and never reaches this code, this origin or any storage of
   ours - which is the only way a page with no server is allowed anywhere near
   a card. Everything below is about opening that frame and listening for the
   one event that says the payment went through.

   paddle.js is fetched the first time someone presses a buy button, and only
   when a token is configured: nobody who cannot pay loads a payment script. */
var PADDLE={ready:false, p:null, plan:''};
/* Paddle translates its own checkout into a fixed list of languages. These
   three are on it; for Hebrew and Arabic the locale is left out so Paddle
   chooses, rather than being handed a code it does not know. */
var PADDLE_LOCALES={en:'en', fr:'fr', ru:'ru'};

function loadPaddle(){
  if(PADDLE.p) return PADDLE.p;
  if(!billingOn()) return Promise.resolve(false);
  PADDLE.p=new Promise(function(done){
    function init(){
      try{
        if(BILLING.env==='sandbox' && window.Paddle.Environment) window.Paddle.Environment.set('sandbox');
        window.Paddle.Initialize({token:BILLING.token, eventCallback:payEvent});
        PADDLE.ready=true; done(true);
      }catch(e){ done(false); }
    }
    if(window.Paddle){ init(); return; }
    var s=document.createElement('script');
    s.src=PADDLE_JS; s.async=true;
    s.onload=init;
    s.onerror=function(){ done(false); };
    document.head.appendChild(s);
  });
  return PADDLE.p;
}

function payMsg(s){ var el=document.getElementById('payMsg'); if(el) el.textContent=s||''; }
function payClose(){
  var m=document.getElementById('payModal'); if(m) m.classList.remove('on');
  try{ if(PADDLE.ready && window.Paddle.Checkout) window.Paddle.Checkout.close(); }catch(e){}
  var box=document.getElementById('payBox'); if(box) box.innerHTML='';
  document.body.classList.remove('no-scroll');
}
/* One modal, opened from the pricing section and from the plans screen alike,
   so there is a single place where a card is ever entered. */
function startCheckout(planId){
  var priceId=BILLING.prices[planId];
  if(!priceId) return;
  PADDLE.plan=planId;
  if(savedProfile()){                   /* never write a profile just to buy */
    P.plan=planId; if(!P.trialStart) P.trialStart=Date.now(); save();
  }
  var m=document.getElementById('payModal'); if(!m) return;
  var th=document.getElementById('payThanks'); if(th) th.hidden=true;
  var box=document.getElementById('payBox'); if(box){ box.hidden=false; box.innerHTML=''; }
  /* The plan and the amount that is about to be charged - the yearly total for
     the annual plan, not the per-month figure the card advertises it at. */
  var pr=PRICES[cur]||PRICES.en, pl=document.getElementById('payPlan');
  if(pl) pl.textContent=t('l.pr.'+planId)+' · '+money(planId==='annual' ? pr.ytot : pr.m);
  m.classList.add('on');
  document.body.classList.add('no-scroll');
  payMsg(t('pay.load'));
  var cb=document.getElementById('payCloseBtn'); if(cb) cb.focus();
  loadPaddle().then(function(ok){
    if(!ok){ payMsg(t('pay.err')); return; }
    try{
      window.Paddle.Checkout.open({
        items:[{priceId:priceId, quantity:1}],
        settings:paySettings()
      });
    }catch(e){ payMsg(t('pay.err')); }
  });
}
function paySettings(){
  var s={
    displayMode:'inline',
    theme:(typeof activeTheme==='function' && activeTheme()==='dark') ? 'dark' : 'light',
    frameTarget:'pay-box',
    frameInitialHeight:'450',
    frameStyle:'width:100%;min-width:312px;background-color:transparent;border:none;'
  };
  if(PADDLE_LOCALES[cur]) s.locale=PADDLE_LOCALES[cur];
  /* No successUrl on purpose: the frame shows its own "paid" state and the app
     unlocks in place, so nobody is bounced to another page mid-purchase. */
  return s;
}
/* Paddle reports back through the one callback registered at Initialize. */
function payEvent(ev){
  var n=ev&&ev.name;
  if(n==='checkout.loaded'||n==='checkout.customer.created'){ payMsg(''); return; }
  if(n==='checkout.completed'){ payDone(ev); return; }
  if(n==='checkout.error'){ payMsg(t('pay.err')); return; }
  if(n==='checkout.closed'){ payMsg(''); return; }
}
function payDone(ev){
  var d=(ev&&ev.data)||{};
  PAID={txn:String(d.transaction_id||d.id||'paid'), at:Date.now(), plan:PADDLE.plan||''};
  savePaid();
  if(savedProfile()){ P.plan=PADDLE.plan||P.plan; save(); }
  var box=document.getElementById('payBox'); if(box){ box.innerHTML=''; box.hidden=true; }
  payMsg('');
  var th=document.getElementById('payThanks'); if(th) th.hidden=false;
  if(typeof toast==='function') toast(t('pay.done.t'));
  renderCheckout();
  if(typeof redrawAll==='function') redrawAll();
}
function bindPay(){
  var cb=document.getElementById('payCloseBtn');
  if(cb) cb.addEventListener('click', payClose);
  var ok=document.getElementById('payOk');
  if(ok) ok.addEventListener('click', payClose);
  var bg=document.getElementById('payModal');
  if(bg) bg.addEventListener('click', function(e){ if(e.target===bg) payClose(); });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){
      var m=document.getElementById('payModal');
      if(m && m.classList.contains('on')) payClose();
    }
  });
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-buy]');
  if(b){ startCheckout(b.dataset.buy); return; }
  if(e.target.closest('[data-go-plans]')){ openPlans(); return; }
  if(e.target.closest('[data-lic-open]')){ openPlans(); focusLicense(); return; }
});
function openPlans(){
  document.getElementById('app').style.display='none';
  document.getElementById('onboarding').style.display='block';
  showStep(8);
}
function focusLicense(){
  var d=document.getElementById('licBox');
  if(d){ d.open=true; var i=document.getElementById('licKey'); if(i) i.focus(); }
}
/* Buy buttons exist only when there is a price behind them, and the privacy
   line tells the truth about the card form only when there is one. */
function renderCheckout(){
  var any=billingOn();
  document.querySelectorAll('[data-buy]').forEach(function(b){
    b.hidden = !(BILLING.token && BILLING.prices[b.dataset.buy]);
  });
  document.querySelectorAll('[data-i18n="l.pr.trust"]').forEach(function(el){ el.hidden=!any; });
  document.querySelectorAll('.plans-soon').forEach(function(el){ el.hidden=any; });
  document.querySelectorAll('[data-contact]').forEach(function(a){
    a.textContent=CONTACT_EMAIL;
    a.href='mailto:'+CONTACT_EMAIL+'?subject='+encodeURIComponent(t('l.pr.ask.sub'));
  });
  /* "everything stays on your device" stops being the whole truth the moment a
     card can be entered, so the qualified version replaces it then. */
  document.querySelectorAll('[data-privacy]').forEach(function(el){
    el.textContent = t(any ? el.dataset.privacyOn : el.dataset.privacy);
  });
  var lb=document.getElementById('licBox'); if(lb) lb.hidden=!licOn();
  /* "manage my subscription" only once there is a subscription to manage: a
     trial and a grandfathered account have nothing behind that link. */
  var pt=document.getElementById('portalLink');
  if(pt){ pt.hidden=!(BILLING.portal && (licActive()||paidHere())); pt.href=BILLING.portal||'#'; }
  renderLicState();
}
function renderLicState(){
  var el=document.getElementById('licState'); if(!el) return;
  var st=proState();
  el.className='lic-state '+st;
  if(st==='pro'){
    el.textContent = LIC.exp ? t('pro.state.pro.exp',{d:fmtDay(String(LIC.exp).slice(0,10))}) : t('pro.state.pro');
  } else if(st==='founder'){ el.textContent=t('pro.state.founder'); }
  else if(st==='trial'){ el.textContent=t('pro.state.trial',{n:trialDaysLeft()}); }
  else if(st==='open'){ el.textContent=''; }
  else { el.textContent=t('pro.state.free'); }
  var rel=document.getElementById('licRelease');
  if(rel) rel.hidden = !licActive();
}
function bindLicense(){
  var btn=document.getElementById('licGo');
  if(btn) btn.addEventListener('click',function(){
    var inp=document.getElementById('licKey'), msg=document.getElementById('licMsg');
    var key=(inp&&inp.value||'').trim();
    if(!key){ if(msg) msg.textContent=t('pro.lic.empty'); return; }
    btn.disabled=true; if(msg) msg.textContent=t('pro.lic.checking');
    activateLicense(key).then(function(r){
      btn.disabled=false;
      if(msg) msg.textContent = r.ok ? t('pro.lic.ok') : (r.err||t('pro.lic.bad'));
      if(r.ok){ if(inp) inp.value=''; renderCheckout(); if(typeof redrawAll==='function') redrawAll(); }
    });
  });
  var rel=document.getElementById('licRelease');
  if(rel) rel.addEventListener('click',function(){
    releaseLicense(); renderCheckout();
    if(typeof redrawAll==='function') redrawAll();
    if(typeof toast==='function') toast(t('pro.lic.released'));
  });
}


/* ================= backup =================
   Everything this app knows lives in localStorage on one device. One "clear
   browsing data" and months of streak are gone with no way back, so export and
   import are free for everyone, forever - charging someone for their own data
   back is not a business model. */
var STORE_KEYS=['proactive_v','proactive_p','proactive_s','proactive_uid',
                'proactive_lang','proactive_gender','proactive_accent',
                'proactive_theme','proactive_quiz','proactive_chain','proactive_tab',
                'proactive_ref'];

function exportBundle(){
  var out={app:'proactivity', v:STORE_V, at:new Date().toISOString(), keys:{}};
  STORE_KEYS.forEach(function(k){
    try{ var v=localStorage.getItem(k); if(v!==null) out.keys[k]=v; }catch(e){}
  });
  return out;
}
function downloadJSON(obj, name){
  var blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },0);
}
function doExport(){
  var d=new Date(), pad=function(n){ return (n<10?'0':'')+n; };
  downloadJSON(exportBundle(), 'proacty-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json');
  if(typeof toast==='function') toast(t('bk.done'));
  if(typeof markBackedUp==='function') markBackedUp();
}

/* A restore overwrites everything, so it says out loud what it is about to
   write before it writes it. */
function bundleSummary(b){
  var p={}, s={};
  try{ p=JSON.parse(b.keys['proactive_p']||'{}'); }catch(e){}
  try{ s=JSON.parse(b.keys['proactive_s']||'{}'); }catch(e){}
  return {
    name: p.name||'',
    points: Number(s.points)||0,
    streak: (s.day&&Number(s.day.streak))||0,
    goals: (s.goals||[]).length,
    at: b.at||''
  };
}
function applyBundle(b){
  STORE_KEYS.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
  Object.keys(b.keys||{}).forEach(function(k){
    if(STORE_KEYS.indexOf(k)<0) return;               /* never write a key we do not own */
    try{ localStorage.setItem(k, b.keys[k]); }catch(e){}
  });
}
function bindBackup(){
  var ex=document.getElementById('bkExport');
  if(ex) ex.addEventListener('click', doExport);
  var inp=document.getElementById('bkFile');
  if(inp) inp.addEventListener('change', function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var msg=document.getElementById('bkMsg');
    var fr=new FileReader();
    fr.onload=function(){
      var b;
      try{ b=JSON.parse(fr.result); }catch(e){ b=null; }
      if(!b || b.app!=='proactivity' || !b.keys){ if(msg) msg.textContent=t('bk.bad'); inp.value=''; return; }
      var sm=bundleSummary(b);
      if(!confirm(t('bk.confirm',{name:sm.name||'—', pts:sm.points, sk:sm.streak, g:sm.goals}))){ inp.value=''; return; }
      applyBundle(b);
      location.reload();
    };
    fr.readAsText(f);
  });
}

/* localStorage throwing is normally silent here; when the device is genuinely
   full the user needs to hear it once, with somewhere to go. */
var quotaWarned=false;
function warnQuota(){
  if(quotaWarned) return; quotaWarned=true;
  if(typeof toast==='function') toast(t('bk.full'));
}

/* ================= calendar =================
   No server means no push notification. A calendar file needs no server, works
   on every phone, and puts the target where the user already looks. */
function icsEscape(s){ return String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
function icsStamp(d){
  function p(n){ return (n<10?'0':'')+n; }
  return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+
         p(d.getUTCHours())+p(d.getUTCMinutes())+'00Z';
}
var ICS_DAYS=['SU','MO','TU','WE','TH','FR','SA'];
/* freq times a week, spread out rather than stacked on consecutive days. */
function spreadDays(startIdx, n){
  n=Math.max(1,Math.min(7,n|0));
  var step=7/n, out=[];
  for(var i=0;i<n;i++) out.push(ICS_DAYS[(startIdx+Math.round(i*step))%7]);
  return out.filter(function(d,i,a){ return a.indexOf(d)===i; });
}
function goalICS(g, hour, minute){
  var start=new Date();
  start.setHours(hour, minute, 0, 0);
  if(start<new Date()) start.setDate(start.getDate()+1);
  var end=new Date(start.getTime()+30*60000);
  var freq=Number(g.freq)||3;
  var title=g.title||t('g.one');
  var body=[g.week||'', g.today||'', g.now||''].filter(Boolean).join('\n');
  return [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Proacty//HE','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:proactivity-'+(g.id||0)+'-'+Date.now()+'@proactivity',
    'DTSTAMP:'+icsStamp(new Date()),
    'DTSTART:'+icsStamp(start),
    'DTEND:'+icsStamp(end),
    'RRULE:FREQ=WEEKLY;BYDAY='+spreadDays(start.getDay(), freq).join(','),
    'SUMMARY:'+icsEscape(title),
    'DESCRIPTION:'+icsEscape(body),
    'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(title),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
}
function downloadICS(g){
  var parts=String(P.remind||'17:00').split(':');
  var text=goalICS(g, Number(parts[0])||17, Number(parts[1])||0);
  var blob=new Blob([text],{type:'text/calendar;charset=utf-8'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='proacty.ics'; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },0);
  if(typeof toast==='function') toast(t('cal.done'));
}

/* ================= install =================
   A habit app that lives in a browser tab gets forgotten. Offered once,
   dismissed for good if the answer is no. Browsers without
   beforeinstallprompt (iOS Safari, Firefox) get the steps instead.
   The button in the profile card stays for anyone who said no and changed
   their mind. */
var installEvt=null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); installEvt=e; showInstall();
});
window.addEventListener('appinstalled', function(){
  installEvt=null;
  var bar=document.getElementById('installBar'); if(bar) bar.classList.remove('on');
  renderInstallBox();
});
function isStandalone(){
  try{ if(window.matchMedia('(display-mode: standalone)').matches) return true; }catch(e){}
  return navigator.standalone===true;
}
function isIOS(){
  var ua=navigator.userAgent||'';
  return /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints>1);
}
function installDismissed(){
  try{ return localStorage.getItem('proactive_install')==='no'; }catch(e){ return true; }
}
function showInstall(){
  renderInstallBox();
  var bar=document.getElementById('installBar');
  if(!bar || isStandalone() || installDismissed()) return;
  if(document.getElementById('app').style.display!=='block') return;
  /* Chrome/Edge/Samsung hand us a real prompt; every other phone browser
     (Safari, Firefox, ...) gets the steps for its own menu. */
  var key=installEvt?'pwa.t':(isIOS()?'pwa.ios':'pwa.other');
  var txt=bar.querySelector('[data-i18n]');
  txt.setAttribute('data-i18n', key); txt.textContent=t(key);
  document.getElementById('installGo').hidden=!installEvt;
  bar.classList.add('on');
}
function renderInstallBox(){
  var box=document.getElementById('installBox');
  if(box) box.hidden=isStandalone();
}
function runInstall(){
  if(installEvt){
    installEvt.prompt();
    installEvt.userChoice.then(function(){ installEvt=null;
      document.getElementById('installBar').classList.remove('on'); renderInstallBox(); });
    return;
  }
  toast(t(isIOS()?'pwa.ios':'pwa.other'));
}
function bindInstall(){
  var go=document.getElementById('installGo'), no=document.getElementById('installNo'),
      any=document.getElementById('installAny');
  if(go) go.addEventListener('click', runInstall);
  if(any) any.addEventListener('click', runInstall);
  if(no) no.addEventListener('click', function(){
    try{ localStorage.setItem('proactive_install','no'); }catch(e){}
    document.getElementById('installBar').classList.remove('on');
  });
}
/* Updating by itself: an installed app can sit open in the background for
   days, and the page only picks up a new version when it reloads. So it
   asks for a new version whenever it comes back to the screen and every
   half hour; when one has taken over, the page reloads - but never while
   someone is typing, then it waits for the next time the app is put away
   or brought back. After the reload a short message says it was updated. */
var swHadController=false, swReloadDue=false;
function swTyping(){
  var a=document.activeElement;
  return !!(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA') && a.value);
}
function swReloadNow(){
  if(!swReloadDue || swTyping()) return;
  swReloadDue=false;
  try{ sessionStorage.setItem('proactive_updated','1'); }catch(e){}
  location.reload();
}
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol==='file:') return;          /* local test runs, not a bug */
  swHadController=!!navigator.serviceWorker.controller;
  var reg=null;
  try{
    navigator.serviceWorker.register('sw.js').then(function(r){ reg=r; }).catch(function(){});
  }catch(e){}
  function check(){ if(reg) reg.update().catch(function(){}); }
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!swHadController){ swHadController=true; return; }    /* the very first install, nothing to refresh */
    swReloadDue=true; swReloadNow();
  });
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') check();
    swReloadNow();
  });
  document.addEventListener('focusout',function(){ setTimeout(swReloadNow,300); });
  setInterval(check, 30*60*1000);
  try{
    if(sessionStorage.getItem('proactive_updated')){
      sessionStorage.removeItem('proactive_updated');
      setTimeout(function(){ if(typeof toast==='function') toast(t('upd.done')); },800);
    }
  }catch(e){}
}


/* ================= XP and levels =================
   Four ranks at fixed XP thresholds - 0, 500, 1500, 4000 - which is exactly
   where levels 1, 5, 10 and 20 have to land. The curve between them is
   piecewise linear so a level always costs a round number and the next one is
   always in sight: 125 XP a level to rank two, 200 to rank three, 250 to rank
   four, 300 after that. */
var RANKS=[
 {tier:1, lvl:1,  xp:0,    k:'av.r1', d:'av.r1.d'},
 {tier:2, lvl:5,  xp:500,  k:'av.r2', d:'av.r2.d'},
 {tier:3, lvl:10, xp:1500, k:'av.r3', d:'av.r3.d'},
 {tier:4, lvl:20, xp:4000, k:'av.r4', d:'av.r4.d'}
];
function levelXp(L){                       /* the XP at which level L begins */
  if(L<=1) return 0;
  if(L<=5) return (L-1)*125;
  if(L<=10) return 500+(L-5)*200;
  if(L<=20) return 1500+(L-10)*250;
  return 4000+(L-20)*300;
}
function levelFor(xp){ var L=1; while(levelXp(L+1)<=xp) L++; return L; }
function rankFor(xp){ var r=RANKS[0]; RANKS.forEach(function(x){ if(xp>=x.xp) r=x; }); return r; }
function levelInfo(){
  var xp=Math.max(0, Number(S.points)||0), L=levelFor(xp), a=levelXp(L), b=levelXp(L+1);
  var r=rankFor(xp), next=null;
  RANKS.forEach(function(x){ if(!next && x.xp>xp) next=x; });
  return {xp:xp, level:L, from:a, to:b, need:b-xp, pct:Math.round((xp-a)/(b-a)*100),
          rank:r, tier:r.tier, next:next};
}
/* kept for the callers that only ever wanted the label, the level and the bar */
function stageInfo(){ var i=levelInfo(); return {stage:t(i.rank.k), level:i.level, progress:i.pct}; }

/* ================= friends bring friends =================
   A static site cannot be told by one device that another device signed up.
   What it can do is hand each user a code, and hand each invited friend a
   short token that only the inviter's code can verify: the friend's own code
   plus a four-character check computed from both. The friend sends it back
   (one tap, via the share sheet), the inviter pastes it, the app recomputes
   the check, and the bonus lands. No server, no account, nothing leaves the
   device that the user did not choose to send. */
var REF_BONUS=100;
var REF_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';     /* no 0/O, no 1/I */
function emptyRef(){ return {code:'', redeemed:[], invited:0, from:null, confirm:null, sent:false}; }
function refHash(s){
  var h=2166136261;
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return h>>>0;
}
function refChk(inviter, friend){
  var h=refHash('proactivity:'+inviter+':'+friend), out='';
  for(var i=0;i<4;i++){ out+=REF_ALPHA.charAt(h%32); h=Math.floor(h/32); }
  return out;
}
function isRefCode(c){ return /^[A-HJ-NP-Z2-9]{6}$/.test(c||''); }
function normToken(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function refCode(){
  if(!S.ref) S.ref=emptyRef();
  if(!S.ref.code){
    var arr=new Uint32Array(6), c='';
    if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(arr);
    else for(var i=0;i<6;i++) arr[i]=Math.floor(Math.random()*4294967296);
    for(var j=0;j<6;j++) c+=REF_ALPHA.charAt(arr[j]%32);
    S.ref.code=c; save();
  }
  return S.ref.code;
}
function inviteLink(){ return location.origin+location.pathname+'?ref='+refCode(); }

/* the inviter's side: paste what the friend sent */
function redeemInvite(raw){
  var tok=normToken(raw);
  if(tok.length!==10) return 'bad';
  var friend=tok.slice(0,6), chk=tok.slice(6);
  if(!isRefCode(friend)) return 'bad';
  if(friend===refCode()) return 'self';
  if(chk!==refChk(refCode(), friend)) return 'bad';
  if(!S.ref.redeemed) S.ref.redeemed=[];
  if(S.ref.redeemed.indexOf(friend)>=0) return 'dup';
  S.ref.redeemed.push(friend); S.ref.invited=(S.ref.invited||0)+1;
  addPts(REF_BONUS); markActiveToday(); save();
  return 'ok';
}
/* the invited side, part one: remember who sent the link. Only a device with
   no profile yet counts as a new sign-up; an existing user opening a friend's
   link is not a referral. The parameter is removed from the address either
   way so a bookmark or a share does not carry it on. */
function captureRefParam(){
  try{
    var p=new URLSearchParams(location.search), r=normToken(p.get('ref'));
    if(!p.has('ref')) return;
    if(isRefCode(r) && !localStorage.getItem('proactive_p')) localStorage.setItem('proactive_ref', r);
    p.delete('ref'); var q=p.toString();
    history.replaceState(null, '', location.pathname+(q?'?'+q:'')+location.hash);
  }catch(e){}
}
/* part two, at the end of onboarding: mint the token the friend sends back */
function applyInvite(){
  var from=null;
  try{ from=localStorage.getItem('proactive_ref'); localStorage.removeItem('proactive_ref'); }catch(e){}
  if(!isRefCode(from)) return;
  if(!S.ref) S.ref=emptyRef();
  var mine=refCode();
  if(from===mine) return;
  S.ref.from=from; S.ref.confirm=mine+refChk(from, mine); S.ref.sent=false;
}

function copyText(text, okKey){
  function done(){ toast(t(okKey)); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ legacyCopy(text); done(); });
  } else { legacyCopy(text); done(); }
}
function legacyCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}
function shareText(text, fallbackKey){
  if(navigator.share){
    navigator.share({text:text}).catch(function(){});
  } else copyText(text, fallbackKey);
}

function renderInvite(){
  var box=document.getElementById('inviteCard'); if(!box) return;
  if(!S.ref) S.ref=emptyRef();
  var link=inviteLink(), n=S.ref.invited||0;
  var from = (S.ref.from && S.ref.confirm && !S.ref.sent)
    ? '<div class="inv-from">'+ic('gift')+'<div>'+

        '<p>'+esc(t('inv.from.s',{n:REF_BONUS}))+'</p>'+
        '<div class="inv-code numf">'+esc(S.ref.confirm)+'</div>'+
        '<div class="inv-btns">'+
          '<button class="btn btn-primary btn-sm" data-inv-send>'+ic('share')+'<span>'+esc(t('inv.from.send'))+'</span></button>'+
          '<button class="btn btn-quiet btn-sm" data-inv-sent>'+esc(t('inv.from.done'))+'</button>'+
        '</div></div></div>'
    : '';
  box.innerHTML = from +
    '<p class="psub">'+esc(t('inv.s',{n:REF_BONUS}))+'</p>'+
    '<div class="inv-link">'+ic('link')+'<span class="inv-url">'+esc(link)+'</span></div>'+
    '<div class="inv-btns">'+
      '<button class="btn btn-primary btn-sm" data-inv-copy>'+ic('copy')+'<span>'+esc(t('inv.copy'))+'</span></button>'+
      '<button class="btn btn-ghost btn-sm" data-inv-share>'+ic('share')+'<span>'+esc(t('inv.share'))+'</span></button>'+
    '</div>'+
    '<details class="ch-free inv-how"><summary>'+ic('chevron')+'<span>'+esc(t('inv.how.t'))+'</span></summary>'+
      '<p class="hint">'+ic('shield')+'<span>'+esc(t('inv.how'))+'</span></p></details>'+
    '<div class="addrow inv-redeem">'+
      '<input type="text" id="invCode" autocomplete="off" autocapitalize="characters" spellcheck="false" '+
        'placeholder="'+esc(t('inv.code.ph'))+'" aria-label="'+esc(t('inv.code.ph'))+'">'+
      '<button class="btn btn-primary" id="invGo">'+esc(t('inv.redeem'))+'</button></div>'+
    '<p class="inv-count">'+ic('users')+'<span>'+esc(t('inv.count',{n:n}))+'</span></p>';

  var cp=box.querySelector('[data-inv-copy]');
  if(cp) cp.addEventListener('click',function(){ copyText(link,'inv.copied'); });
  var sh=box.querySelector('[data-inv-share]');
  if(sh) sh.addEventListener('click',function(){ shareText(t('inv.share.msg',{url:link}),'inv.copied'); });
  var sd=box.querySelector('[data-inv-send]');
  if(sd) sd.addEventListener('click',function(){ shareText(t('inv.msg',{c:S.ref.confirm}),'inv.code.copied'); });
  var st=box.querySelector('[data-inv-sent]');
  if(st) st.addEventListener('click',function(){ S.ref.sent=true; save(); renderInvite(); });
  var go=document.getElementById('invGo'), inp=document.getElementById('invCode');
  function redeem(){
    var r=redeemInvite(inp.value);
    if(r==='ok'){ inp.value=''; toast(t('inv.ok',{n:REF_BONUS})); renderInvite(); renderStats(); renderDash(); checkAchievements(); }
    else toast(t(r==='dup' ? 'inv.dup' : r==='self' ? 'inv.self' : 'inv.bad'));
  }
  if(go) go.addEventListener('click', redeem);
  if(inp) inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); redeem(); } });
}

/* "Homework on time" means nothing to a 35-year-old: the study options have an
   adult set. The rest read the same at any age. */
function kindKeys(area){
  var adult = area==='study' && ageBand(P.age)!=='a13';
  var out=[];
  for(var n=1;n<=6;n++) out.push(adult ? 'gk.study.a.'+n : 'gk.'+area+'.'+n);
  return out;
}

/* ================= chain state ================= */
/* step: 0 area · 1 kind · 2 freq · 3 obstacle · 4 result */
var CH=null;
/* The check-in already asked which areas matter and what gets in the way, so
   the chain starts from those answers instead of asking the same thing twice.
   They are a starting point, not a decision - every one of them is still a
   button the user can change. */
function quizPick(which){
  var q=S.quiz;
  return (q && q[which] && q[which].length) ? q[which][0] : null;
}
function emptyChain(){
  return {step:0, area:null, kind:null, kindText:'', freq:null, obst:quizPick('blocks')};
}
function saveChain(){ try{ localStorage.setItem('proactive_chain', JSON.stringify(CH)); }catch(e){} }
function loadChain(){
  try{ var raw=localStorage.getItem('proactive_chain'); if(raw){ var c=JSON.parse(raw); if(c && typeof c.step==='number') CH=c; } }catch(e){}
  if(!CH) CH=emptyChain();
}
function resetChain(){ CH=emptyChain(); saveChain(); }
var chainHostId=null;

/* ================= composing the target ================= */
function kindLabel(){
  if(!CH) return '';
  if(CH.kind==='other') return CH.kindText||t('gc.other');
  return CH.kind ? t(CH.kind) : '';
}
/* The goal's name is what the user calls it - prefilled with what they
   chose, editable on the last screen. How often is kept on the goal as
   freq and shown beside the name, never glued into it. */
function chainTitle(){ return (CH.name||'').trim() || kindLabel(); }
function chainWeek(){  return t('gw.line',{freq:t('gf.'+(CH.freq||3)), kind:chainTitle()}); }
function chainToday(){ return t('gd.'+(CH.area||'goals'),{kind:chainTitle()}); }
function chainNow(){   return t('gn.'+(CH.obst||'other')); }

/* A goal built here carries where it came from, so the ladder can be
   regenerated in another language and the weekly mission knows its area. */
function goalFromChain(){
  var g=newGoal(chainTitle());
  g.area=CH.area; g.kind=CH.kind; g.kindText=CH.kindText; g.freq=CH.freq||3; g.obst=CH.obst;
  g.why=(CH.why||'').trim();
  g.week=chainWeek(); g.today=chainToday(); g.now=chainNow();
  g.actions=[
    {id:uid++, key:null, text:chainNow(),   done:false},
    {id:uid++, key:null, text:chainToday(), done:false},
    {id:uid++, key:null, text:chainWeek(),  done:false}
  ];
  return g;
}

function renderChain(hostId){
  var host=document.getElementById(hostId||chainHostId);
  if(!host) return;
  chainHostId=hostId||chainHostId;
  if(!CH) loadChain();
  var s=CH.step, html='';

  if(s===0){
    html=chainHead(0)+'<h3 class="ch-q">'+esc(t('gc.t'))+'</h3><p class="psub">'+esc(t('gc.s'))+'</p>'+
      '<div class="opts ch-areas">'+AREAS.map(function(a){
        var want=!!(S.quiz && S.quiz.areas && S.quiz.areas.indexOf(a.id)>=0);
        return optBtn('area',a.id,t('ga.'+a.id),a.icon,CH.area===a.id,want); }).join('')+'</div>'+

function bindChain(host){
  host.querySelectorAll('[data-ch-back]').forEach(function(b){
    b.addEventListener('click',function(){ CH.step=Math.max(0,CH.step-1); saveChain(); renderChain(); });
  });
  host.querySelectorAll('[data-area]').forEach(function(b){
    b.addEventListener('click',function(){
      if(CH.area!==b.dataset.area){ CH.kind=null; CH.kindText=''; }
      CH.area=b.dataset.area; CH.step=1; saveChain(); renderChain();
    });
  });
  host.querySelectorAll('[data-kind]').forEach(function(b){
    b.addEventListener('click',function(){
      CH.kind=b.dataset.kind; saveChain();
      if(CH.kind==='other'){ renderChain(); var inp=document.getElementById('chKindText'); if(inp) inp.focus(); return; }
      CH.step=2; saveChain(); renderChain();
    });
  });
  var kt=host.querySelector('#chKindText');
  if(kt){
    kt.addEventListener('input',function(){ CH.kindText=kt.value; saveChain();
      var nx=host.querySelector('[data-ch-next]'); if(nx) nx.disabled=!kt.value.trim(); });
    kt.addEventListener('keydown',function(e){ if(e.key==='Enter' && kt.value.trim()){ e.preventDefault(); CH.step=2; saveChain(); renderChain(); } });
  }
  host.querySelectorAll('[data-ch-next]').forEach(function(b){
    b.addEventListener('click',function(){
      if(CH.kind==='other' && !(CH.kindText||'').trim()) return;
      CH.step=Math.min(4,CH.step+1); saveChain(); renderChain();
    });
  });
  host.querySelectorAll('[data-freq]').forEach(function(b){
    b.addEventListener('click',function(){ CH.freq=Number(b.dataset.freq); CH.step=3; saveChain(); renderChain(); });
  });
  host.querySelectorAll('[data-obst]').forEach(function(b){
    b.addEventListener('click',function(){ CH.obst=b.dataset.obst; CH.step=4; saveChain(); renderChain(); });
  });
  bindWhy(host,'chWhy',function(v){ CH.why=v; saveChain(); });
  var nm=host.querySelector('#chName');
  if(nm) nm.addEventListener('input',function(){ CH.name=nm.value; saveChain(); });
  host.querySelectorAll('[data-ch-save]').forEach(function(b){
    b.addEventListener('click',function(){ commitChain(false); });
  });
  host.querySelectorAll('[data-ch-start]').forEach(function(b){
    b.addEventListener('click',function(){ commitChain(true); });
  });
  host.querySelectorAll('[data-ch-plan]').forEach(function(b){
    b.addEventListener('click',function(){ openPlanFor(CH.area); });
  });
}

/* The one exit from the chain. During onboarding the goal is parked on the
   profile and seeded when setup finishes; in the app it is added directly. */
function commitChain(start){
  var g=goalFromChain();
  var dup=(S.goals||[]).some(function(x){ return x.title===g.title; });
  if(dup && !onbActive){ toast(t('gc.dup')); return; }
  /* The first target of a new account is written during onboarding, before any
     limit could sensibly apply, so the gate is only outside it. */
  if(!onbActive && goalLimitReached()){ toast(t('pro.goalmax',{n:GOAL_FREE_MAX})); openPlans(); return; }
  if(onbActive){
    P.chainGoal={goal:g, start:!!start};
    resetChain();
    finishOnboarding();
    return;
  }
  S.goals.unshift(g);
  if(typeof prefLearn==='function') prefLearn(goalCat(g),2);
  if(start) startGoal(g); else { save(); tip('goal.new'); }
  resetChain();
  var host=document.getElementById('goalChain'); if(host){ host.innerHTML=''; host.hidden=true; }
  var nb=document.getElementById('newGoalBtn'); if(nb) nb.hidden=false;
  renderGoals(); renderDash(); checkAchievements();
}

/* Sport already has a built training plan in the Body tab; every other
   area has a lesson that fits. Neither is invented for this - they are the
   parts of the app that were already there. */
function openPlanFor(area){
  var a=areaById(area);
  if(!a) return;
  if(onbActive){ P.planAfter=area; toast(t('gl.saved')); return; }
  if(!a.lesson){ goPage('body'); showMini('sport'); return; }
  goPage('learn');
  var d=document.querySelectorAll('#lsGrid details')[a.lesson-1];
  if(d){ d.open=true; d.scrollIntoView({block:'start'}); }
}

/* ================= starting a target ================= */
/* Creating a target changes nothing. THIS is what starts the counters: the
   goal is marked started, its weekly mission appears on the grid with the
   frequency the user chose, and only now does the day count. */
function startGoal(g){
  if(!g || g.started) return;
  g.started=true; g.startedAt=dayKey();
  var a=areaById(g.area);
  var target=Math.min(7,Math.max(1, g.freq===5 ? 6 : (g.freq||3)));
  S.missions.push({id:uid++, catId:a?a.cat:'hobby', titleKey:null, title:g.title,
                   target:target, goalId:g.id,
                   days:[false,false,false,false,false,false,false]});
  markActiveToday();
  save();
  toast(t('gc.started.t'));
  tip('goal.start');
  renderGoals(); renderWeek(); renderDash(); checkAchievements();
}

/* ================= micro-tips ================= */
/* One short line tied to the action that just happened, at most once per
   action type per day, so it reads as the app noticing rather than nagging. */
var TIPS={'task.done':1,'goal.new':1,'goal.start':1,'goal.done':1,'task.skip':1,'streak':1,'lesson':1};
var tipT;
function tip(kind){
  if(!TIPS[kind]) return;
  if(!S.tips) S.tips={};
  var day=dayKey();
  if(S.tips[kind]===day) return;
  S.tips[kind]=day; save();
  var el=document.getElementById('tipCard');
  if(!el) return;
  el.innerHTML='<span class="tip-lab">'+ic('sparkles')+esc(t('tip.lab'))+'</span><span class="tip-tx">'+esc(t('tip.'+kind))+'</span>';
  el.classList.add('on');
  clearTimeout(tipT); tipT=setTimeout(function(){ el.classList.remove('on'); },5200);
}

/* the seven dates of the current week, Sunday first */
function weekDays(){
  var now=new Date(), out=[];
  var start=new Date(now); start.setDate(now.getDate()-now.getDay());
  for(var i=0;i<7;i++){ var d=new Date(start); d.setDate(start.getDate()+i); out.push(dayKey(d)); }
  return out;
}

      ic('arrow')+'</button>';

  var list=workoutSets()[type];
  run={type:type, list:list, i:0, started:Date.now()};
  renderRun();
  sportScreen('run');
}

function renderRun(){
  clearRest();
  var ex=run.list[run.i], total=run.list.length;
  document.getElementById('spOf').textContent=t('sp.of',{n:run.i+1,t:total});
  document.getElementById('spExName').textContent=t(ex.k);
  document.getElementById('spExReps').textContent=ex.r;
  document.getElementById('spExCue').textContent=ex.cue?t(ex.cue):'';
  document.getElementById('spDots').innerHTML=run.list.map(function(_,i){
    return '<span class="dot'+(i<run.i?' done':'')+(i===run.i?' now':'')+'"></span>';
  }).join('');
  document.getElementById('spRest').classList.remove('on');
  document.getElementById('spExBody').classList.remove('resting');
}

function clearRest(){
  if(restTimer){ clearInterval(restTimer); restTimer=null; }
  var r=document.getElementById('spRest');
  if(r) r.classList.remove('on');
}

function finishExercise(){
  if(!run) return;
  if(run.i >= run.list.length-1){ endRun(); return; }
  var left=25;
  var nextName=t(run.list[run.i+1].k);
  var box=document.getElementById('spRest');
  var num=document.getElementById('spRestN');
  document.getElementById('spRestNext').textContent=t('sp.next',{x:nextName});
  document.getElementById('spExBody').classList.add('resting');
  box.classList.add('on');
  num.textContent=left;
  restTimer=setInterval(function(){
    left--;
    num.textContent=Math.max(0,left);
    if(left<=0) advance();
  },1000);
}
function advance(){
  clearRest();
  if(!run) return;
  run.i++;
  if(run.i>=run.list.length){ endRun(); return; }
  renderRun();
}

function endRun(){
  clearRest();
  if(!run) return;
  var sp=miniState().sport;
  var mins=Math.max(1, Math.round((Date.now()-run.started)/60000)) || 1;
  var n=run.list.length;
  sp.sessions.unshift({d:dayKey(), type:run.type, n:n, mins:mins});
  if(sp.sessions.length>60) sp.sessions.length=60;
  bumpStreak(sp);
  addPts(15);
  save();
  document.getElementById('spDoneN').textContent=t('sp.done.n',{n:n});
  document.getElementById('spDoneM').textContent=t('sp.done.m',{min:mins});
  document.getElementById('spDoneMsg').textContent=t(pick(['sp.enc.1','sp.enc.2','sp.enc.3','sp.enc.4']));
  run=null;
  renderStats();
  sportScreen('done');
}

/* Reuses buildSkin(), so the wording and the per-step explanations stay the
   ones already translated for the routine that shipped before. */
/* The routine stores which steps were chosen, not their wording. It used to
   keep the resolved text, which meant a routine written in Hebrew stayed in
   Hebrew after switching the app to English and kept the old gender besides. */
function buildRoutine(){
  var d=skinDraft;
  var type=({normal:'normal',oily:'oily',dry:'dry',combo:'combo'})[d.feel]||'normal';
  var am=[0,1,2], pm=[0,1,2];
  if(d.depth==='basic'){ am=[0,2]; pm=[1,2]; }   // drop the optional middle step
  function step(k){ return {k:k, product:''}; }
  return {type:type, react:d.react, depth:d.depth, am:am.map(step), pm:pm.map(step)};
}
/* Resolves a stored routine against the current language and gender. */
function routineSteps(sk, which){
  var blocks=buildSkin((sk.routine&&sk.routine.type)||'normal');
  var items=(which==='am'?blocks[0]:blocks[1]).items;
  return (sk.routine[which]||[]).map(function(s){
    var it=items[s.k|0] || items[0];
    return {n:it.n, d:it.d, product:s.product||''};
  });
}
/* Routines written before the step references existed keep their products and
   their shape; only the wording starts following the language again. */
function migrateRoutine(sk){
  var r=sk && sk.routine; if(!r) return;
  ['am','pm'].forEach(function(w){
    var arr=r[w]; if(!arr || !arr.length || arr[0].k!==undefined) return;
    var idx = (w==='am')
      ? (arr.length===2 ? [0,2] : [0,1,2])
      : (arr.length===2 ? [1,2] : [0,1,2]);
    r[w]=arr.map(function(s,i){ return {k:(idx[i]!==undefined?idx[i]:i), product:s.product||''}; });
  });
}

  document.getElementById('snPm').innerHTML=list('pm');

  pmBtn.classList.toggle('done', !!log.pm);

  pmBtn.innerHTML=ic(log.pm?'check':'moon')+'<span>'+esc(t(log.pm?'sn.done.pm':'sn.did.pm'))+'</span>';

    var l=sk.log[d]||{};

      '<span class="wk-d">'+esc(names[i])+'</span>'+
      '<span class="wk-m">'+(part?ic('check'):'')+'</span></div>';

               '<span class="hr-m">'+esc(parts.join(' · '))+'</span></div>';

}

function scoreRecipes(){
  var have=miniState().fridge.pantry;
  return RECIPES.map(function(r){
    var hit=r.ing.filter(function(k){ return have.indexOf(k)>=0; });
    var miss=r.ing.filter(function(k){ return have.indexOf(k)<0; });
    return {r:r, hit:hit, miss:miss, score:hit.length/r.ing.length};
  })
  .filter(function(x){ return x.hit.length>=2 && x.score>=0.5; })
  .sort(function(a,b){ return (b.score-a.score) || (a.miss.length-b.miss.length); });
}

function byId(id){ for(var i=0;i<RECIPES.length;i++) if(RECIPES[i].id===id) return RECIPES[i]; return null; }

  var hit=r.ing.filter(function(k){ return have.indexOf(k)>=0; });
  var miss=r.ing.filter(function(k){ return have.indexOf(k)<0; });
  return {r:r, hit:hit, miss:miss, score:r.ing.length?hit.length/r.ing.length:0};
}

/* Keep the stored photo small: localStorage is a few MB and a raw phone
   photo would blow the quota and lose everything else with it. */
function shrinkPhoto(dataUrl, cb){
  var img=new Image();
  img.onload=function(){
    var max=900, w=img.width, h=img.height;
    var s=Math.min(1, max/Math.max(w,h));
    var cv=document.createElement('canvas');
    cv.width=Math.round(w*s); cv.height=Math.round(h*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    try{ cb(cv.toDataURL('image/jpeg',0.7)); }catch(e){ cb(dataUrl); }
  };
  img.onerror=function(){ cb(dataUrl); };
  img.src=dataUrl;
}

   What is on my mind, sorted: in my hands (or part of it) becomes one small
   step that can go straight into My day; not in my hands can be let go. */
function cirItems(){ if(!S.circle) S.circle=[]; return S.circle; }
function cirById(id){ return cirItems().filter(function(x){ return x.id===id; })[0]; }
function renderCircle(){
  var box=document.getElementById('cirBox'); if(!box) return;
  var all=cirItems(), today=dayKey();
  var ask=all.filter(function(x){ return !x.k; });
  var mine=all.filter(function(x){ return x.k==='in' || x.k==='part'; });
  var out=all.filter(function(x){ return x.k==='out'; });
  function askCard(x){
    return '<div class="cir-item ask"><p class="cir-t">'+esc(x.t)+'</p>'+
      '<div class="mg-lab">'+esc(t('cir.ask'))+'</div>'+

        '<button type="button" class="opt" data-cir-k="part" data-id="'+x.id+'">'+ic('compass')+'<span>'+esc(t('cir.part'))+'</span></button>'+

  function mineCard(x){

      '<button class="btn btn-quiet btn-sm" data-cir-k="in" data-id="'+x.id+'">'+esc(t('cir.backin'))+'</button></div></div>';
  }
  /* things that often weigh on someone of this age, minus what is already here */
  var band=P.age ? ageBand(P.age) : 'a13', have={};
  all.forEach(function(x){ have[normLine(x.t)]=1; });
  var sug=[1,2,3,4,5].map(function(n){ return t('cirw.'+band+'.'+n); }).filter(function(x){ return !have[normLine(x)]; });
  box.innerHTML=
    '<div class="field"><label for="cirIn">'+esc(t('cir.q'))+'</label>'+
      '<div class="addrow"><input type="text" id="cirIn" maxlength="100" placeholder="'+esc(t('cir.ph'))+'">'+
      '<button class="btn btn-primary" id="cirAdd" aria-label="'+esc(t('c.add'))+'">'+ic('plus')+'</button></div>'+
      (sug.length ? '<div class="mg-lab cir-sug">'+esc(t('cir.sug'))+'</div><div class="mg-picks">'+sug.map(function(x){
        return '<button type="button" class="t3idea" data-cirw="'+esc(x)+'">'+ic('plus')+'<span>'+esc(x)+'</span></button>'; }).join('')+'</div>' : '')+
    '</div>'+
    ask.map(askCard).join('')+
    (mine.length ? '<div class="cir-ring in"><h3>'+ic('target')+'<span>'+esc(t('cir.h.in'))+'</span></h3>'+mine.map(mineCard).join('')+'</div>' : '')+
    (out.length ? '<div class="cir-ring out"><h3>'+ic('seedling')+'<span>'+esc(t('cir.h.out'))+'</span></h3>'+out.map(outCard).join('')+'</div>' : '')+

    b.addEventListener('click',go);
    s.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); go(); } });
  });
  box.querySelectorAll('[data-cir-day]').forEach(function(b){
    b.addEventListener('click',function(){
      var x=cirById(Number(b.dataset.cirDay));

    });

    b.addEventListener('click',function(){

    });
  });
  box.querySelectorAll('[data-cir-let]').forEach(function(b){
    b.addEventListener('click',function(){

    });

/* ================= the monthly nudge to back up =================
   Shown on Home once there are a few days worth keeping and the last backup
   is a month old (or there never was one). "Next week" puts it away for
   seven days. */
function bkState(){ try{ return JSON.parse(localStorage.getItem('proactive_bk')||'{}')||{}; }catch(e){ return {}; } }
function bkSet(o){ try{ localStorage.setItem('proactive_bk', JSON.stringify(o)); }catch(e){} }
function markBackedUp(){ var b=bkState(); b.last=dayKey(); b.later=null; bkSet(b); renderBackupAsk(); renderBackupLast(); }
function renderBackupLast(){
  var el=document.getElementById('bkLast'); if(!el) return;
  var b=bkState();
  el.textContent = b.last ? t('bk.last',{d:fmtDay(b.last)}) : t('bk.never');
}
function renderBackupAsk(){
  var box=document.getElementById('bkAsk'); if(!box) return;
  var b=bkState(), today=dayKey(), days=Object.keys(S.log||{}).length;
  var due = days>=5 && (!b.last || daysBetween(b.last,today)>=30) && !(b.later && b.later>today);
  box.hidden=!due; if(!due) return;
  box.innerHTML='<h2 class="boxh">'+ic('shield')+'<span>'+esc(t('bk.ask.t'))+'</span></h2>'+
    '<p class="psub">'+esc(t('bk.ask.s'))+'</p>'+
    '<div class="row-btns"><button class="btn btn-primary btn-sm" data-bk-go>'+ic('arrow')+'<span>'+esc(t('bk.ask.go'))+'</span></button>'+
    '<button class="btn btn-quiet btn-sm" data-bk-later>'+esc(t('bk.ask.later'))+'</button></div>';
  box.querySelector('[data-bk-go]').addEventListener('click',doExport);
  box.querySelector('[data-bk-later]').addEventListener('click',function(){
    var d=new Date(); d.setDate(d.getDate()+7); var s=bkState(); s.later=dayKey(d); bkSet(s); box.hidden=true;
  });
}

/* ================= finding materials on the internet =================
   From any row in My day, or a goal's materials: one query, editable, and
   four ways to look - videos, guides and articles, podcasts, or the whole
   web. A link found there can be pasted back: into the goal's materials,
   or kept beside a one-off thing. The app itself never fetches anything;
   the search opens in the browser. */
var srchFor=null;   // {gid} or {item: index in today's things}
function srchOpen(target){
  srchFor=target;
  var g=target.gid ? goalById(target.gid) : null;
  var it=(target.item!==undefined) ? today3().items[target.item] : null;
  var base=g ? g.title : (it ? it.t : '');
  var extra=g && g.area ? t('yt.q.'+g.area) : '';
  if(extra.indexOf('yt.q.')===0) extra='';
  var ways=[['vid','play',extra],['guide','book',t('srch.guide.q')],['pod','activity',t('srch.pod.q')],['web','globe','']];
  document.getElementById('srchBody').innerHTML=
    '<p class="psub">'+esc(t('srch.s'))+'</p>'+
    '<input type="text" id="srchQ" maxlength="100" value="'+esc(base)+'" aria-label="'+esc(t('srch.s'))+'">'+
    '<div class="srch-ways">'+ways.map(function(w){
      return '<button type="button" class="srch-way" data-srch="'+w[0]+'" data-extra="'+esc(w[2])+'">'+ic(w[1])+'<span>'+esc(t('srch.'+w[0]))+'</span></button>'; }).join('')+'</div>'+
    '<div class="field srch-save"><label for="srchUrl">'+esc(t('srch.save'))+'</label>'+
      '<div class="addrow"><input type="url" inputmode="url" id="srchUrl" placeholder="'+esc(t('res.url.ph'))+'">'+
      '<button class="btn btn-ghost" id="srchKeep">'+esc(t('c.save'))+'</button></div></div>'+
    (it && it.url ? '<p class="hint">'+ic('link')+'<span>'+esc(it.url)+'</span></p>' : '');
  var m=document.getElementById('srchModal'); m.classList.add('on');
  m.querySelectorAll('[data-srch]').forEach(function(b){
    b.addEventListener('click',function(){
      var q=document.getElementById('srchQ').value.trim(); if(!q) return;
      var full=(q+' '+(b.dataset.extra||'')).trim(), url;
      if(b.dataset.srch==='vid') url='https://www.youtube.com/results?search_query='+encodeURIComponent(full);
      else url='https://www.google.com/search?hl='+encodeURIComponent(cur||'he')+'&q='+encodeURIComponent(full);
      if(g) prefLearn(goalCat(g),0.5);
      window.open(url,'_blank','noopener');
    });
  });
  document.getElementById('srchKeep').addEventListener('click',srchKeep);
}
function srchKeep(){
  var inp=document.getElementById('srchUrl'), url=inp.value.trim();
  if(url && !/^https?:\/\//i.test(url) && /^[\w-]+(\.[\w-]+)+/.test(url)) url='https://'+url;
  if(!/^https?:\/\/\S+\.\S+/i.test(url)){ toast(t('res.bad')); inp.focus(); return; }
  var yt=ytId(url), name;
  try{ name = yt ? t('res.ytname') : new URL(url).hostname.replace(/^www\./,''); }catch(e){ name=url; }
  if(srchFor && srchFor.gid){
    var g=goalById(srchFor.gid); if(!g) return;
    if(!g.res) g.res=[];
    g.res.push({id:uid++, url:url, title:name, yt:yt});
    toast(t('srch.saved'));
  } else if(srchFor && srchFor.item!==undefined){
    var it=today3().items[srchFor.item]; if(!it) return;
    it.url=url; toast(t('srch.saved.i'));
  }
  save(); srchClose(); renderToday3(); if(typeof renderGoals==='function') renderGoals();
}
function srchClose(){ document.getElementById('srchModal').classList.remove('on'); srchFor=null; }
document.getElementById('srchClose').addEventListener('click',srchClose);
document.getElementById('srchModal').addEventListener('click',function(e){ if(e.target.id==='srchModal') srchClose(); });


/* ================= camera ================= */
var camStream=null;
function openCam(name,cb){
  var modal=document.getElementById('camModal'), v=document.getElementById('camV'),
      pv=document.getElementById('camP'), fi=document.getElementById('camF'),
      bar=document.getElementById('camBtns');
  document.getElementById('camTN').textContent=name;
  pv.style.display='none'; v.style.display='block'; modal.classList.add('on');
  var shot=null;

  function stop(){ if(camStream){ camStream.getTracks().forEach(function(t){t.stop();}); camStream=null; } }
  function close(){ stop(); modal.classList.remove('on'); }
  function mk(cls,html){ var b=document.createElement('button'); b.className='btn '+cls; b.innerHTML=html; return b; }
  /* A photo is a nice record, not a gate: closing without one still counts. */
  function skipBtn(){ var k=mk('btn-ghost', ic('check')+'<span>'+esc(t('c.nophoto'))+'</span>'); k.onclick=function(){ close(); cb(null); }; return k; }

  function buttons(mode){
    bar.innerHTML='';
    if(mode==='live'){
      var s=mk('btn-primary', ic('camera')+'<span>'+esc(t('c.takephoto'))+'</span>'),
          g=mk('btn-ghost',   ic('image')+'<span>'+esc(t('c.gallery'))+'</span>'),
          c=mk('btn-quiet',   esc(t('c.cancel')));
      s.onclick=function(){
        var cv=document.createElement('canvas');
        cv.width=v.videoWidth||640; cv.height=v.videoHeight||480;
        cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
        shot=cv.toDataURL('image/jpeg',0.6);
        pv.src=shot; pv.style.display='block'; v.style.display='none'; stop(); buttons('ok');
      };
      g.onclick=function(){ fi.click(); };
      c.onclick=close;
      bar.append(s,g,skipBtn(),c);
    } else if(mode==='upload'){
      var u=mk('btn-primary', ic('image')+'<span>'+esc(t('c.choosephoto'))+'</span>'),
          c2=mk('btn-quiet', esc(t('c.cancel')));
      u.onclick=function(){ fi.click(); }; c2.onclick=close;
      bar.append(u,skipBtn(),c2);
    } else {
      var ok=mk('btn-primary', ic('check')+'<span>'+esc(t('c.use'))+'</span>'),
          re=mk('btn-ghost', esc(t('c.retake')));
      ok.onclick=function(){ close(); cb(shot); };
      re.onclick=function(){ pv.style.display='none'; start(); };
      bar.append(ok,re);
    }
  }
  fi.onchange=function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(ev){ shot=ev.target.result; pv.src=shot; pv.style.display='block';
      v.style.display='none'; stop(); buttons('ok'); };
    r.readAsDataURL(f); fi.value='';
  };
  function start(){
    v.style.display='block';
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
        .then(function(s){ camStream=s; v.srcObject=s; buttons('live'); })
        .catch(function(){ v.style.display='none'; buttons('upload'); });
    } else { v.style.display='none'; buttons('upload'); }
  }
  start();
}

/* ================= home ================= */
function fmtMin(m){ return !m ? '' : (m>=60 ? Math.floor(m/60)+t('c.hr') : m+' '+t('c.min')); }

function addTask(catId,title,min){
  if(!String(title||'').trim()) return;
  S.tasks.push({id:uid++,catId:catId,titleKey:null,title:String(title).trim(),
                min:Number(min)||0,done:false,photo:null});
  save(); renderTasks(); renderStats(); renderDash();
}
function toggleTask(id){
  var task=null;
  S.tasks.forEach(function(x){ if(x.id===id) task=x; });
  if(!task) return;
  if(task.done){
    task.done=false; task.photo=null; addPts(-10);
    S.stats.tasksDone=Math.max(0,(S.stats.tasksDone||0)-1);
    save(); renderTasks(); renderStats(); renderDash(); return;
  }
  openCam(label(task), function(photo){
    task.photo=photo; task.done=true; addPts(10);
    S.stats.tasksDone=(S.stats.tasksDone||0)+1;
    markActiveToday();
    toast(praise()); save(); tip('task.done');
    renderTasks(); renderStats(); renderDash(); checkAchievements();
  });
}
function delTask(id){
  S.tasks=S.tasks.filter(function(x){ return x.id!==id; });
  save(); renderTasks(); renderStats(); renderDash();
}

function renderRing(){
  var svg=document.getElementById('rSvg');
  var r=54, cx=66, cy=66, sw=10, circ=2*Math.PI*r;
  var track=cssVar('--ink-3')||'#333947', fill=cssVar('--acc')||'#3DDCA8';
  var total=S.tasks.length;
  if(!total){
    svg.innerHTML='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+track+'" stroke-width="'+sw+'" stroke-dasharray="3 7"/>';
    document.getElementById('rPct').textContent='0%'; return;
  }
  var out='', off=0;
  CATS.forEach(function(cat){
    var ct=S.tasks.filter(function(x){ return x.catId===cat.id; });
    if(!ct.length) return;
    var done=ct.filter(function(x){ return x.done; }).length;
    var seg=(ct.length/total)*circ, filled=seg*(done/ct.length);
    out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+track+'" stroke-width="'+sw+'" stroke-dasharray="'+(seg-2)+' '+(circ-seg+2)+'" stroke-dashoffset="'+(-off)+'"/>';
    if(filled>0)
      out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+fill+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+Math.max(0,filled-2)+' '+(circ-filled+2)+'" stroke-dashoffset="'+(-off)+'"/>';
    off+=seg;
  });
  svg.innerHTML=out;
  var d=S.tasks.filter(function(x){ return x.done; }).length;
  document.getElementById('rPct').textContent=Math.round(d/total*100)+'%';
}

function renderCats(){
  var grid=document.getElementById('catGrid'); grid.innerHTML='';
  CATS.forEach(function(cat){

        (x.min?'<button class="tmr" data-tid="'+x.id+'" data-min="'+x.min+'" aria-label="'+esc(t('c.timer'))+'">'+ic('play')+'</button>':'')+
        '<button class="icon-btn" data-del="'+x.id+'" aria-label="'+esc(t('c.delete'))+'">'+ic('x')+'</button>'+

    }).join('') : '<div class="empty">'+esc(t('h.empty'))+'</div>';

    var sugs=(cat.sg||['sg.generic']).map(function(k){
      return '<button class="sug" data-cat="'+cat.id+'" data-sug="'+esc(t(k))+'">'+esc(t(k))+'</button>';
    }).join('');

    card.innerHTML=
      '<div class="cathead"><div class="nm">'+ic(cat.icon)+'<span>'+esc(catName(cat))+'</span></div>'+
      '<div class="ct numf"><b>'+done+'</b>/'+ct.length+'</div></div>'+

  });

  grid.querySelectorAll('.cb').forEach(function(cb){

                 grid.querySelector('.ntmin[data-cat="'+c+'"]').value);

  grid.querySelectorAll('.nt').forEach(function(inp){
    inp.addEventListener('keydown',function(e){
      if(e.key!=='Enter') return;
      var c=inp.dataset.cat;
      addTask(c, inp.value, grid.querySelector('.ntmin[data-cat="'+c+'"]').value);

var timers={};
function startTimer(btn,minutes){
  var id=btn.dataset.tid;
  if(timers[id]){ clearInterval(timers[id]); delete timers[id];
    btn.classList.remove('run'); btn.innerHTML=ic('play'); return; }
  var left=minutes*60;
  btn.classList.add('run');
  timers[id]=setInterval(function(){
    left--;
    btn.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    if(left<=0){
      clearInterval(timers[id]); delete timers[id];
      btn.classList.remove('run'); btn.innerHTML=ic('play'); toast(t('t.timerdone'));
    }
  },1000);
}

/* ================= goals ================= */
/* The point of this screen is the ladder: a goal is only real once it says
   what it means this week, what it means today, and what you do right now. */
function goalById(id){
  var g=null;
  (S.goals||[]).forEach(function(x){ if(x.id===id) g=x; });
  return g;
}
function goalPct(g){
  if(!g.actions.length) return 0;
  var done=g.actions.filter(function(a){ return a.done; }).length;
  return Math.round(done/g.actions.length*100);
}
/* A finished target is kept, not deleted: it is the evidence the app exists to
   produce. It folds down to one line and can be reopened. */
function archivedCard(g){
  var card=document.createElement('article'); card.className='goal archived';
  card.innerHTML='<h3>'+ic('check')+'<span>'+esc(g.title)+'</span>'+
    '<button class="icon-btn" data-dg="'+g.id+'" aria-label="'+esc(t('c.delete'))+'">'+ic('trash')+'</button></h3>'+
    '<span class="gstate done">'+ic('check')+esc(t('gc.done',{d:fmtDay(g.doneAt)}))+'</span>'+
    '<div class="gtools"><button class="btn btn-ghost btn-sm" data-gback="'+g.id+'">'+ic('refresh')+
      '<span>'+esc(t('gc.reopen'))+'</span></button></div>';
  return card;
}

function fmtDay(k){
  if(!k) return '';
  try{ return new Date(k+'T00:00:00').toLocaleDateString(cur,{day:'numeric',month:'short'}); }catch(e){ return k; }
}

/* ================= week ================= */
function dayNames(){
  var base=new Date(2024,0,7); // a Sunday
  var out=[];
  for(var i=0;i<7;i++){
    var d=new Date(base); d.setDate(base.getDate()+i);
    out.push(d.toLocaleDateString(cur,{weekday:'short'}));
  }
  return out;
}
function missionState(m){
  var c=m.days.filter(Boolean).length;
  if(m.target>0 && c>=m.target) return {txt:t('w.st.win'), cls:'win', met:true};
  if(c>0 && c>=Math.ceil(m.target/2)) return {txt:t('w.st.close'), cls:'mid', met:false};
  if(c>0) return {txt:t('w.st.going'), cls:'mid', met:false};
  return {txt:t('w.st.none'), cls:'none', met:false};
}
function renderWeek(){
  var days=dayNames(), today=new Date().getDay();
  document.getElementById('wHead').innerHTML=
    '<th class="mcol">'+esc(t('w.col.mission'))+'</th>'+
    days.map(function(d,i){ return '<th'+(i===today?' class="today"':'')+'>'+esc(d)+'</th>'; }).join('')+
    '<th>'+esc(t('w.col.status'))+'</th>';

  var body=document.getElementById('wBody'); body.innerHTML='';
  var met=0;
  S.missions.forEach(function(m){
    var cat=catById(m.catId)||{icon:'star'};
    var st=missionState(m); if(st.met) met++;
    var count=m.days.filter(Boolean).length;
    var tr=document.createElement('tr');
    var html='<td class="mcol"><div class="mrow">'+ic(cat.icon)+
      '<div><div class="mt">'+esc(label(m))+'</div>'+
      '<div class="mm">'+esc(t('w.target'))+' <span class="numf">'+count+'/'+m.target+'</span></div></div>'+
      '<button class="icon-btn" data-dm="'+m.id+'" aria-label="'+esc(t('c.delete'))+'">'+ic('x')+'</button></div></td>';
    m.days.forEach(function(on,di){
      html+='<td class="dcell'+(on?' on':'')+'" data-mid="'+m.id+'" data-day="'+di+'">'+
            '<span class="mk">'+ic('check')+'</span></td>';
    });
    html+='<td class="scell '+st.cls+'">'+esc(st.txt)+'</td>';
    tr.innerHTML=html; body.appendChild(tr);
  });
  if(!S.missions.length)
    body.innerHTML='<tr><td colspan="9" class="empty" style="padding:var(--s4)">'+esc(t('w.empty'))+'</td></tr>';

  document.getElementById('wMet').textContent=met;
  document.getElementById('wTot').textContent=S.missions.length;

  body.querySelectorAll('.dcell').forEach(function(cell){
    cell.addEventListener('click',function(){
      var m=null;
      S.missions.forEach(function(x){ if(x.id===Number(cell.dataset.mid)) m=x; });
      if(!m) return;
      var d=Number(cell.dataset.day);
      m.days[d]=!m.days[d];
      addPts(m.days[d]?6:-6);
      if(m.days[d]){ toast(praise()); markActiveToday(); }
      save(); renderWeek(); renderStats(); renderDash(); checkAchievements();
    });
  });
  body.querySelectorAll('[data-dm]').forEach(function(b){
    b.addEventListener('click',function(){
      S.missions=S.missions.filter(function(m){ return m.id!==Number(b.dataset.dm); });
      save(); renderWeek();
    });
  });
}

function renderPlan(gridId,blocks,prefix){
  var grid=document.getElementById(gridId); grid.innerHTML='';
  blocks.forEach(function(block,bi){
    var card=document.createElement('div'); card.className='pcard';
    var title = block.k ? t(block.k) : block.label;
    var items=block.items.map(function(item,ii){
      var key=prefix+'-'+bi+'-'+ii;
      var checked=S.plan[key]?' checked':'';
      var name = item.k ? t(item.k) : item.n;
      var cam  = item.k ? false : !!item.cam;   // workout items are not photo-gated
      var meta = item.r ? '<span class="pr">'+ic('clock')+esc(item.r)+'</span>'
               : cam    ? '<span class="pr">'+ic('camera')+'</span>' : '';
      return '<div class="pitem">'+
        '<input type="checkbox" class="cb" data-key="'+key+'" data-cam="'+(cam?1:0)+'" data-name="'+esc(name)+'"'+checked+'>'+
        '<div class="pb"><span class="px'+(checked?' done':'')+'">'+esc(name)+'</span>'+
        (item.d?'<div class="pd">'+esc(item.d)+'</div>':'')+'</div>'+meta+'</div>';
    }).join('');
    card.innerHTML='<h3><span>'+esc(title)+'</span><span class="dnum">'+t('c.day')+' '+(bi+1)+'</span></h3>'+
      (block.sub?'<div class="psub2">'+esc(block.sub)+'</div>':'')+items;
    grid.appendChild(card);
  });

  grid.querySelectorAll('.cb').forEach(function(cb){
    cb.addEventListener('change',function(e){
      var key=e.target.dataset.key;
      if(e.target.checked){
        if(e.target.dataset.cam==='1'){
          e.target.checked=false;
          openCam(e.target.dataset.name,function(){
            S.plan[key]=true; addPts(8); toast(t('t.proof'));
            save(); renderPlan(gridId,blocks,prefix); renderStats();
          });
        } else {
          S.plan[key]=true; addPts(8); toast(praise()); save(); renderStats();
          var px=e.target.closest('.pitem').querySelector('.px'); if(px) px.classList.add('done');
        }
      } else {
        delete S.plan[key]; addPts(-8); save(); renderStats();
        var px2=e.target.closest('.pitem').querySelector('.px'); if(px2) px2.classList.remove('done');
      }
    });
  });
}

    o.addEventListener('click',function(){ setGender(o.dataset.hgnd); save(); box.hidden=true; toast(t('gl.saved')); });
  });

/* ---- my day: the same small ritual for everyone, every morning ----
   Three things that matter today, written by the user, before the
   personal step. A new day starts with three empty lines. */
/* The day is chosen, not handed out: picked holds the goals chosen for
   today, items the one-off things (an idea or the user's own words). A goal
   that already has today's step or was done today counts as chosen, which
   also carries over a day started before this existed. Empty lines from the
   old three fixed slots are dropped. */
var T3_MAX=5;
function today3(){
  var d=dayKey();
  if(!S.today3 || S.today3.day!==d) S.today3={day:d, items:[], picked:[]};
  var td=S.today3;
  td.items=td.items.filter(function(x){ return x.t && x.t.trim(); });
  if(!td.picked) td.picked=[];
  (S.goals||[]).forEach(function(g){
    if(!g.archived && td.picked.indexOf(g.id)<0 && ((g.day && g.day.d===d) || g.doneDay===d)) td.picked.push(g.id);
  });
  return td;
}
function pickedGoals(){
  var td=today3(); return liveGoals().filter(function(g){ return td.picked.indexOf(g.id)>=0; });
}
function addDayItem(text){
  var td=today3(); text=String(text||'').trim(); if(!text) return false;
  if(td.items.length>=T3_MAX){ toast(t('t3.full')); return false; }
  if(td.items.some(function(x){ return normLine(x.t)===normLine(text); })) return true;
  td.items.push({t:text, done:false, paid:false, gid:null}); logDay(); save(); return true;
}
/* In the order they were made, so a new goal joins the list under the
   others instead of pushing the first one down. */
/* Ideas for the three lines, in this order: today's step of each goal
   (already linked to it), then what trains the area the check-in found
   weakest, then everyday things for the user's age. Lines already written
   are left out, and without a check-in a one-minute one is offered. */
function t3Ideas(td){
  var used={}; td.items.forEach(function(x){ used[normLine(x.t)]=1; });
  var out=[];
  function add(text,cat){ if(!text || used[normLine(text)] || out.length>=6) return; used[normLine(text)]=1; out.push({t:text,cat:cat||null}); }
  /* first, a day's step from the categories this user keeps choosing */
  var have={}; (S.goals||[]).forEach(function(g){ if(g.rg) have[g.rg]=1; });
  topCats().slice(0,2).forEach(function(c){
    var rs=READY_GOALS.filter(function(r){ return r[3]===c && readyFits(r) && !have[r[0]]; });
    if(rs.length){ var r=rs[(new Date().getDate())%rs.length]; add(t('rg.'+r[0]+'.d'),c); }
  });
  if(hasProfile()) [1,2].forEach(function(n){ add(t('sq.'+weakDim()+'.'+n)); });
  var band=P.age ? ageBand(P.age) : 'a13';
  [1,2,3,4,5,6].forEach(function(n){ add(t('sq.'+band+'.'+n)); });
  return out;
}
function liveGoals(){
  return (S.goals||[]).filter(function(g){ return !g.archived; }).sort(function(a,b){ return a.id-b.id; });
}
/* The day's record, rewritten on every change so the last state of a day is
   what stays: the three lines (text, done, which goal they serve) and which
   goals' own step was done. That is what My week reads. */
var LOG_DAYS=120;
function logDay(){
  var td=today3();
  if(!S.log) S.log={};
  var prev=S.log[td.day]||{};
  S.log[td.day]={
    note: prev.note||'', feel: prev.feel||'', choice: prev.choice||'',
    items: td.items.filter(function(x){ return x.t.trim(); })
             .map(function(x){ return {t:x.t.trim(), done:!!x.done, gid:x.gid||null, url:x.url||null}; }),
    steps: (S.goals||[]).filter(function(g){ return g.doneDay===td.day; }).map(function(g){ return g.id; }),
    st: {},   // the text of each step that was done, so My week can show it
    rest: (S.goals||[]).filter(function(g){ return g.restDay===td.day; }).map(function(g){ return g.id; })
  };
  (S.goals||[]).forEach(function(g){ if(g.doneDay===td.day && dayStep(g)) S.log[td.day].st[g.id]=dayStep(g); });
  var days=Object.keys(S.log).sort();
  while(days.length>LOG_DAYS) delete S.log[days.shift()];
}
var t3PickOpen=false, t3IdeasMore=false;
function renderToday3(){
  var box=document.getElementById('todayBox'); if(!box) return;
  var td=today3(), all=liveGoals(), goals=pickedGoals(), today=dayKey(), running=!!fiveTimer;

  /* the picker, in order of weight: my goals as full rows, then three
     ideas (more on request), then a line in my own words */
  var ideas=t3Ideas(td), shown=t3IdeasMore ? ideas : ideas.slice(0,3);
  function optRow(attrs, icon, text, on, cls){

      '<span class="t3opt-i">'+ic(icon)+'</span><span class="t3opt-t">'+esc(text)+'</span>'+

  var picker=
    '<div class="mg-lab">'+esc(t(all.length?'t3.pick.goals':'t3.pick.sug'))+'</div>'+
    '<div class="t3list">'+(all.length

    )+'</div>'+
    (all.length ? '' : '<button type="button" class="btn btn-quiet btn-sm t3nogoal" data-goto-goals>'+ic('plus')+'<span>'+esc(t('t3.nogoal'))+'</span></button>')+
    (shown.length && td.items.length<T3_MAX

          return optRow('data-idea="'+esc(x.t)+'"'+(x.cat?' data-cat="'+x.cat+'"':''),'sparkles',x.t,false,'idea'); }).join('')+'</div>'+
        (!t3IdeasMore && ideas.length>3 ? '<button type="button" class="btn btn-quiet btn-sm t3moreideas" data-t3more>'+esc(t('t3.moreideas'))+'</button>' : '')

    (td.items.length<T3_MAX ? '<div class="addrow t3own"><input type="text" id="t3Own" maxlength="80" placeholder="'+esc(t('t3.other.ph'))+'" aria-label="'+esc(t('t3.other.ph'))+'">'+
        '<button class="btn btn-ghost" id="t3OwnAdd" aria-label="'+esc(t('c.add'))+'">'+ic('plus')+'</button></div>' : '')+

  /* what was chosen: a row per goal (its step chosen in place, then ticked), then the one-off things */
  var gRows=goals.map(function(g){

      (g.why ? '<p class="t3g-why">'+ic('compass')+'<span>'+esc(t('why.lab'))+' '+esc(g.why)+'</span></p>' : '')+
      '<div class="addrow"><input type="text" data-mg-step-in="'+g.id+'" maxlength="100" placeholder="'+esc(t('mg.ask'))+'" aria-label="'+esc(t('mg.ask'))+'">'+
        '<button class="btn btn-primary" data-mg-step-set="'+g.id+'">'+esc(t('c.save'))+'</button></div>'+
      (stepChoices(g).length ? '<div class="mg-picks">'+stepChoices(g).map(function(x){
          return '<button type="button" class="t3idea" data-mg-step-pick="'+g.id+'" data-text="'+esc(x)+'">'+ic('plus')+'<span>'+esc(x)+'</span></button>';
        }).join('')+'</div>' : '')+
      /* materials can be looked for before the step is chosen, too */
      '<button type="button" class="btn btn-quiet btn-sm t3srch" data-srch-g="'+g.id+'">'+ic('globe')+'<span>'+esc(t('srch.t'))+

    return '<div class="t3row t3g'+(done?' done':'')+'">'+

      '<div class="t3g-body"><div class="t3g-goal">'+ic('target')+'<span>'+esc(g.title)+'</span></div><div class="t3g-step">'+esc(step)+'</div>'+
        (fiveGid===g.id && running ? '<div class="t3g-run" id="fiveTxt">'+esc(t('d.running',{t:'5:00'}))+'</div>' : '')+'</div>'+
